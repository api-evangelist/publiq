    Checkin:
      description: 'Model used both for registering and searching checkins.


        The `passholder` field is automatically included in responses if you have PASSHOLDERS_SEARCH permission. It is not required for check-in creation.'
      type: object
      title: Checkin
      x-tags:
      - Models
      x-stoplight:
        id: e0c828e2c92cb
      properties:
