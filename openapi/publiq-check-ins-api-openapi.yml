          format: byte
          x-stoplight:
            id: ikgxjklji2guj
          writeOnly: true
        registrationNote:
          type: string
          description: Only used in passholder creation. The admin-private note about this pas
          x-stoplight:
            id: 449kx338dtu1q
          writeOnly: true
      required:
