      operationId: event-calendar-put
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../models/event-calendar-put.json
              - $ref: ../models/event-calendar-put-deprecated.json
            examples:
              single:
                value:
                  calendarType: single
                  subEvent:
                  - startDate: '2021-05-17T22:00:00+00:00'
                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              multiple:
                value:
                  calendarType: multiple
                  subEvent:
                  - startDate: '2020-05-17T22:00:00+00:00'
                    endDate: '2020-05-17T22:00:00+00:00'
                    status:
                      type: Unavailable
                      reason:
                        nl: Geannuleerd wegens COVID-19
                        en: Cancelled due to COVID-19
                    bookingAvailability:
                      type: Unavailable
                  - startDate: '2021-05-17T22:00:00+00:00'
                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              periodic:
                value:
                  calendarType: periodic
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
              permanent:
                value:
                  calendarType: permanent
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
        description: New calendar information.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      description: 'Updates the calendar information of the given `eventId`. The calendar information will be completely replaced with the new one.


        The required properties depend on the `calendarType` property.


        | calendarType | required | optional |

        |---|---|---|

        | single | subEvent\[0\].startDate, subEvent\[0\].endDate | subEvent\[0\].status, subEvent\[0\].bookingAvailability |

        | multiple | subEvent\[\*\].startDate, subEvent[\*\].endDate | subEvent\[\*\].status, subEvent\[\*\].bookingAvailability |

        | periodic | startDate, endDate | openingHours, status, bookingAvailability |

        | permanent | | openingHours, status, bookingAvailability |


        > If `status` or `bookingAvailability` is missing on the event or a subEvent, it will default to `Available`.

        >

        > Although the status and bookingAvailability are optional they have a default value of `Available`. When the status and bookingAvailability is not provided an already set value will be overwritten to `Available`!


        > You can use `single` and `multiple` interchangeably as long as you also include `subEvent` as well. The API will use the correct type based on the number of subEvents inside `subEvent`.


        > This endpoint also supports a deprecated schema that uses `timeSpans` instead of `subEvent`. The `timeSpans` also have a slightly different structure than `subEvent`. For new integrations, it is recommended to use the schema with the `subEvent` property.

        >

        > For existing integrations the `timeSpans` property will be supported indefinitely for backward compatibility.'
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}/calendar-summary:
    parameters:
    - $ref: '#/components/parameters/eventId'
    get:
      summary: calendar summary - get
      tags:
      - Events
      responses:
        '200':
          description: 'The calendar summary in either plain text or HTML.


            For example:

            ```

            Van 6 januari 2021 tot 23 juni 2021 (geannuleerd)

            ```


            Or:

            ```

            <span class=\"cf-from cf-meta\">Van</span> <span class=\"cf-date\">6 januari 2021</span> <span class=\"cf-to cf-meta\">tot</span> <span class=\"cf-date\">23 juni 2021</span> <span title=\"Deze activiteit is waarschijnlijk geannuleerd omwille van preventieve coronamaatregelen.\" class=\"cf-status\">(geannuleerd)</span>

            ```'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: event-calendar-summary-get
      description: 'Returns a human-readable summary of the calendar information of the event. Can be configured to return either plain text or HTML, and to switch between five different formats depending on the amount of space you have to display it.


        > For backward compatibility this endpoint is also accessible at the old abbreviated `/events/{eventId}/calsum` path.'
      parameters:
      - schema:
          type: string
          enum:
          - text
          - html
          default: text
        in: query
        name: style
        description: Deprecated alternative to the `accept` header. Supported for backward compatibility.
        deprecated: true
      - schema:
          type: string
          enum:
          - xs
          - sm
          - md
          - lg
          default: lg
        in: query
        name: size
        description: Defines the size of the summary. Larger summaries contain more detail for events with multiple dates/hours but will also take up more space when shown in a UI. We recommend to use the format `md` for the search results (and `lg` for events with calendarType single), and to always use `lg` for the detailpage. In some cases (e.g. mobile apps) calendar summary `xs` can be useful.
      - schema:
          type: string
          enum:
          - nl
          - fr
          - en
          - de
          default: nl
        in: query
        name: language
        description: Defines the language that the summary will be written in. Also influences the date/time format used.
      - schema:
          type: boolean
          default: false
        in: query
        name: hidePast
        description: Will hide past dates in summaries of events with multiple dates. By default, past dates are not excluded from the calendar summary.
      - schema:
          type: string
          default: Europe/Brussels
        in: query
        name: timezone
        description: The timezone to format date/times in.
      - schema:
          type: string
          enum:
          - text/plain
          - text/html
        in: header
        name: accept
        description: Indicates the expected content-type. Defaults to `text/plain` but can be set to `text/html` for a HTML response.
      - schema:
          type: string
          enum:
          - nl_BE
          - fr_BE
          - en_BE
          - de_BE
        in: query
        name: langCode
        description: Deprecated alternative to the `language` query parameter. Supported for backward compatibility.
        deprecated: true
      - schema:
          type: string
          enum:
          - xs
          - sm
          - md
          - lg
        in: query
        name: format
        description: Deprecated alternative to the `size` query parameter. Supported for backward compatibility.
        deprecated: true
      x-internal: false
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
