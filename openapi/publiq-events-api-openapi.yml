        > This operation is deprecated and should not be used in new integrations. Use the `POST /events` operation instead to create new events.

        >

        > Both operations accept the same JSON bodies nowadays, and support creating events with only the required properties or with additional optional properties.

        >

        > The only difference is that the default `workflowStatus` for events created via `POST /events` is `DRAFT`, while new events created via this `POST /imports/events` operation will have the default workflowStatus `READY_FOR_VALIDATION` for backward compatibility with historical integrations.

        >

        > If you want your new events to also have the workflowStatus `READY_FOR_VALIDATION`, you can use the `POST /events` operation and explicitly set the `workflowStatus` property in your JSON body to `READY_FOR_VALIDATION`.'
