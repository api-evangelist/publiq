                    - - opens: '13:00'
                        closes: '17:00'
                        dayOfWeek:
                        - monday
                      - opens: 09:00
                        closes: '17:00'
                        dayOfWeek:
                        - tuesday
                        - wednesday
                        - thursday
                        - friday
                        - saturday
                        - sunday
                  startDate:
                    title: event.startDate
                    description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) starts, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                      Required on events when using one of the following calendarTypes:


                      - `single`

                      - `multiple`

                      - `periodic`


                      Always required on subEvents.'
                    type: string
                    format: date-time
                    examples:
                    - '2021-05-17T22:00:00+00:00'
                  endDate:
                    title: event.endDate
                    description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) ends, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                      Required on events when using one of the following calendarTypes:


                      - `single`

                      - `multiple`

                      - `periodic`


                      Always required on subEvents.'
                    type: string
                    format: date-time
                    examples:
                    - '2021-05-17T22:00:00+00:00'
                required:
                - calendarType
                allOf:
                - if:
                    required:
                    - calendarType
                    properties:
                      calendarType:
                        const: single
                  then:
                    required:
                    - timeSpans
                - if:
                    required:
                    - calendarType
                    properties:
                      calendarType:
                        const: multiple
                  then:
                    required:
                    - timeSpans
                - if:
                    required:
                    - calendarType
                    properties:
                      calendarType:
                        const: periodic
                  then:
                    required:
                    - startDate
                    - endDate
            examples:
              single:
                value:
                  calendarType: single
                  subEvent:
                  - startDate: '2021-05-17T22:00:00+00:00'
                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              multiple:
                value:
                  calendarType: multiple
                  subEvent:
