                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              periodic:
                value:
                  calendarType: periodic
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
