openapi: 3.2.0
info:
  title: Publiq Events API
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Events across 4 of this provider''s published API definitions: uitdatabank-entry.json, uitpas-uitpas.json, publiq-uitdatabank-entry-openapi.yml, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://io-test.uitdatabank.be
  description: Testing
- url: https://io.uitdatabank.be
  description: Production
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Events
paths:
  /events:
    post:
      summary: event - create
      tags:
      - Events
      responses:
        '201':
          description: The event was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: UUID of the created event to use in subsequent requests or to store as a reference in your application.
                  eventId:
                    type: string
                    format: uuid
                    deprecated: true
                    description: Deprecated, use `id` instead.
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                    description: URL of the created event to use in subsequent requests or to store as a reference in your application.
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - eventId
                - url
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: event-post
      description: 'Creates a new event with the required properties and any additional optional properties.


        By default, the new event will be editable and removable by the user or client that the access token used to perform this request belongs to. If you use a user access token, the user for which the token was obtained will see the new event in their dashboard in UiTdatabank and will be able to edit or remove it. If you use a client access token, only API requests with a token for the same client will be able to edit or remove it.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: 'The complete details of the new event to create. The schema of the event is the same as the response of the [`GET /events/{eventId}`](./entry.json/paths/~1events~1{eventId}/get) operation.


          This request also supports an older deprecated schema that was used to create an event with just its required fields. If you have an existing integration that still uses this schema, you can view it by switching from the `event` schema to `event.post (deprecated)` below.'
        content:
          application/json:
            schema:
              $ref: ../models/event-post.json
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}:
    parameters:
    - $ref: '#/components/parameters/eventId'
    get:
      summary: event - get
      tags:
      - Events
      responses:
        '200':
          description: Event details.
          content:
            application/json:
              schema:
                $ref: ../models/event-with-read-example.json
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: event-get
      description: Returns the details of the event for the given `eventId`.
    put:
      summary: event - update
      operationId: event-put
      responses:
        '200':
          description: The event was updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                    description: UUID of the updated event to use in subsequent requests or to store as a reference in your application.
                  eventId:
                    type: string
                    format: uuid
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: Deprecated, use `id` instead.
                    deprecated: true
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/events/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: URL of the updated event to use in subsequent requests or to store as a reference in your application.
                    format: uri
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - eventId
                - url
              examples:
                Example:
                  value:
                    id: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    eventId: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    url: https://io-test.uitdatabank.be/events/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    commandId: 92973349-967e-44d7-83a2-e1972d9e1622
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: 'Updates the event with the given `eventId` by completely overwriting it with the properties in the given JSON.


        > Any existing optional properties on the event that are not included in the update request will be removed from the event when updating the event via this operation.

        >

        > As an exception, some existing `labels` or `hiddenLabels` may be kept on the event even if they are not included in the update request. For example if they were added via the UiTdatabank UI, or if the client or user making the request does not have sufficient permission to remove some specific labels.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/event-with-write-example.json
        description: The complete details of the event to update. The schema of the event is the same as the response of the [`GET /events/{eventId}`](./entry.json/paths/~1events~1{eventId}/get) operation.
      tags:
      - Events
    delete:
      summary: event - delete
      operationId: event-delete
      responses:
        '204':
          description: No Content. The event's `workflowStatus` was successfully updated to `DELETED`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Does a soft-delete of the event. The event will continue to exist but it's `workflowStatus` will be changed to `DELETED`. This will remove it from all publication channels.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Events
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /imports/events:
    post:
      summary: event - import (create)
      tags:
      - Events
      responses:
        '201':
          description: The event was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: UUID of the created event to use in subsequent requests or to store as a reference in your application.
                  eventId:
                    type: string
                    format: uuid
                    deprecated: true
                    description: Deprecated, use `id` instead.
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                    description: URL of the created event to use in subsequent requests or to store as a reference in your application.
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - eventId
                - url
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: event-import-new
      deprecated: true
      description: 'Creates a new event via the historical `/imports/events` URL.


        > This operation is deprecated and should not be used in new integrations. Use the `POST /events` operation instead to create new events.

        >

        > Both operations accept the same JSON bodies nowadays, and support creating events with only the required properties or with additional optional properties.

        >

        > The only difference is that the default `workflowStatus` for events created via `POST /events` is `DRAFT`, while new events created via this `POST /imports/events` operation will have the default workflowStatus `READY_FOR_VALIDATION` for backward compatibility with historical integrations.

        >

        > If you want your new events to also have the workflowStatus `READY_FOR_VALIDATION`, you can use the `POST /events` operation and explicitly set the `workflowStatus` property in your JSON body to `READY_FOR_VALIDATION`.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: The complete details of the new event to create. The schema of the event is the same as the response of the [`GET /events/{eventId}`](./entry.json/paths/~1events~1{eventId}/get) operation.
        content:
          application/json:
            schema:
              $ref: ../models/event-post.json
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /imports/events/{eventId}:
    parameters:
    - $ref: '#/components/parameters/eventId'
    put:
      summary: event - import (update)
      operationId: event-import-update
      deprecated: true
      responses:
        '200':
          description: The event was updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                    description: UUID of the updated event to use in subsequent requests or to store as a reference in your application.
                  eventId:
                    type: string
                    format: uuid
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: Deprecated, use `id` instead.
                    deprecated: true
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/events/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: URL of the updated event to use in subsequent requests or to store as a reference in your application.
                    format: uri
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - eventId
                - url
              examples:
                Example:
                  value:
                    id: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    eventId: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    url: https://io-test.uitdatabank.be/events/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    commandId: 92973349-967e-44d7-83a2-e1972d9e1622
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: 'Updates the event via the historical `/imports/events/{eventId}` URL by completely overwriting it with the properties in the given JSON.


        > This operation is deprecated and should not be used in new integrations. Use the `PUT /events/{eventId}` operation instead to update existing events, which accepts exactly the same JSON body.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/event-with-write-example.json
        description: The complete details of the event to update. The schema of the event is the same as the response of the [`GET /events/{eventId}`](./entry.json/paths/~1events~1{eventId}/get) operation.
      tags:
      - Events
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}/copies:
    parameters:
    - $ref: '#/components/parameters/eventId'
    post:
      summary: event - copy
      tags:
      - Events
      responses:
        '201':
          description: The event was copied successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  eventId:
                    type: string
                    description: UUID of the new event to use in subsequent requests or to store as a reference in your application.
                  url:
                    type: string
                    description: URL of the new event to use in subsequent requests or to store as a reference in your application.
              examples:
                Example:
                  value:
                    eventId: 83a12220-9459-4fc8-b1ed-71b3d1668e65
                    url: https://io-test.uitdatabank.be/events/83a12220-9459-4fc8-b1ed-71b3d1668e65
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (subEvent) are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: event-copies-post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../models/event-calendar-put.json
              - $ref: ../models/event-calendar-put-deprecated.json
            examples:
              single:
                value:
                  calendarType: single
                  subEvent:
                  - startDate: '2021-05-17T22:00:00+00:00'
                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              multiple:
                value:
                  calendarType: multiple
                  subEvent:
                  - startDate: '2020-05-17T22:00:00+00:00'
                    endDate: '2020-05-17T22:00:00+00:00'
                    status:
                      type: Unavailable
                      reason:
                        nl: Geannuleerd wegens COVID-19
                        en: Cancelled due to COVID-19
                    bookingAvailability:
                      type: Unavailable
                  - startDate: '2021-05-17T22:00:00+00:00'
                    endDate: '2021-05-17T22:00:00+00:00'
                    status:
                      type: Available
                    bookingAvailability:
                      type: Available
              periodic:
                value:
                  calendarType: periodic
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
              permanent:
                value:
                  calendarType: permanent
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
        description: New calendar information for the event copy.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      description: 'Creates a new event based on all the properties of an existing event with the given `eventId`. Only the calendar information will be completely replaced with a new one, which has to be included in the request body.


        The schema of the request body is the same as the one for the `PUT /events/{eventId}/calendar` endpoint.'
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}/attendance-mode:
    parameters:
    - $ref: '#/components/parameters/eventId'
    put:
      summary: attendanceMode - update
      tags:
      - Events
      responses:
        '204':
          description: No Content. The event's attendance mode was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (attendanceMode) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: event-attendance-mode-put
      description: 'Updates the attendance mode of an event. There are three different attendance modes:

        - `offline`: the event takes places on a physical location

        - `online`: the events takes places on an online location

        - `mixed`: the event takes places both on a real location and a online location


        When changing from attendance mode online to either offline or mixed it is required to include the location property with the URI or UUID of the (physical) location that the event is taking place at.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/event-attendanceMode-put.json
            examples:
              Online:
                value:
                  attendanceMode: online
              Offline:
                value:
                  attendanceMode: offline
                  location: https://io-test.uitdatabank.be/places/85b04295-479c-40f5-b3dd-469dfb4387b3
        description: New attendanceMode to set on the event, and optionally a new location (when moving from attendanceMode `online` to `mixed` or `offline`).
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}/audience:
    parameters:
    - $ref: '#/components/parameters/eventId'
    put:
      summary: audience - update
      operationId: event-audience-put
      responses:
        '204':
          description: No Content. The event's audience was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitdatabank/incompatible-audience-type'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /audienceType
                      error: 'The data (int) should match the type: string'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Events
      description: 'Updates the intended audience of the event, which currently only has one property `audienceType`.


        By default the audienceType is set to `everyone`. If needed the audience can be updated to `members` to hide it on public channels, or `education` for CultuurKuur events for schools.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/event-audience.json
            examples:
              Everyone (default):
                value:
                  audienceType: everyone
              Members:
                value:
                  audienceType: members
              Education (CultuurKuur):
                value:
                  audienceType: education
        description: New audienceType to set on the event.
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /events/{eventId}/available-from:
    parameters:
    - $ref: '#/components/parameters/eventId'
    put:
      summary: availableFrom - update
      operationId: event-availableFrom-put
      responses:
        '204':
          description: No Content. The event's availableFrom was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /availableFrom
                      error: 'The data (int) should match the type: date-time'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
