          $ref: '#/components/responses/NotFound'
      description: 'Updates the general status on the top level of the event with the given `eventId`.


        The status of any subEvents that the event has will also be updated to match the general status.'
      requestBody:
        content:
          application/json:
            schema:
              title: event.status
              description: Indicates if the [event](./models/event.json) is still happening as scheduled or not.
              type: object
              properties:
                type:
                  enum:
                  - Available
                  - TemporarilyUnavailable
                  - Unavailable
                  example: Available
                  description: 'One of three possible status types.


                    - `Available`: Happening or open as scheduled

                    - `TemporarilyUnavailable`: Postponed or temporarily closed

                    - `Unavailable`: Cancelled or permanently closed'
                  type: string
                reason:
                  description: The reason of the status, as a localized human-readable text.
                  type: object
                  examples:
                  - nl: Nederlandse tekst
                    fr: Texte français
                    de: Deutscher Text
                    en: English text
                  properties:
                    nl:
                      type: string
                      description: Dutch reason
                      example: Nederlandse reden
                      pattern: \S
                      minLength: 1
                    fr:
                      type: string
                      description: French reason
                      example: Raison français
                      pattern: \S
                      minLength: 1
                    de:
                      type: string
                      description: German reason
                      example: Deutscher Grund
                      pattern: \S
                      minLength: 1
                    en:
                      type: string
                      description: English reason
                      example: English reason
                      pattern: \S
                      minLength: 1
              required:
              - type
              examples:
              - type: Available
              - type: TemporarilyUnavailable
                reason:
                  nl: Uitgesteld wegens covid-19
                  en: Postponed due to covid-19
              - type: Unavailable
                reason:
                  nl: Permanent gesloten
            examples:
              Event takes place as planned:
                value:
                  type: Available
              Event postponed to a later date yet to be determined:
                value:
                  type: TemporarilyUnavailable
              Event cancelled:
                value:
                  type: Unavailable
                  reason:
                    nl: Geannuleerd wegens ziekte van de lesgever
