      operationId: event-attendance-mode-put
      description: 'Updates the attendance mode of an event. There are three different attendance modes:

        - `offline`: the event takes places on a physical location

        - `online`: the events takes places on an online location

        - `mixed`: the event takes places both on a real location and a online location


        When changing from attendance mode online to either offline or mixed it is required to include the location property with the URI or UUID of the (physical) location that the event is taking place at.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              title: event.attendanceMode.put
              type: object
              properties:
                attendanceMode:
                  title: event.attendanceMode
                  type: string
                  description: Indicates if the [event](./models/event.json) is happening online, offline, or both (mixed).
                  enum:
                  - online
                  - offline
                  - mixed
                location:
                  title: place.@id
                  type: string
                  format: uri
                  pattern: ^http[s]?:\/\/.+?\/place[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                  description: A unique URI that acts as globally unique ID for the [place](./models/place.json). Based on (JSON-LD node identifiers)[https://www.w3.org/TR/json-ld/#node-identifiers].
                  examples:
                  - https://io-test.uitdatabank.be/places/85b04295-479c-40f5-b3dd-469dfb4387b3
              additionalProperties: false
              required:
              - attendanceMode
              if:
                properties:
                  attendanceMode:
                    const: online
              then:
                properties:
                  attendanceMode:
                    title: event.attendanceMode
                    type: string
                    description: Indicates if the [event](./models/event.json) is happening online, offline, or both (mixed).
                    enum:
                    - online
                    - offline
                    - mixed
                additionalProperties: false
            examples:
              Online:
                value:
                  attendanceMode: online
              Offline:
                value:
                  attendanceMode: offline
                  location: https://io-test.uitdatabank.be/places/85b04295-479c-40f5-b3dd-469dfb4387b3
        description: New attendanceMode to set on the event, and optionally a new location (when moving from attendanceMode `online` to `mixed` or `offline`).
