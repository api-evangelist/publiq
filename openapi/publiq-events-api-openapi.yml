                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
              permanent:
