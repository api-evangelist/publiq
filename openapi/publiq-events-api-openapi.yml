  /events/{eventId}/sub-events:
    parameters:
    - $ref: '#/components/parameters/eventId'
    patch:
      summary: subEvent - patch
      operationId: event-subEvent-patch
      description: 'Updates the given subEvents on the event with the given `eventId`.


        Allows partial updates, omitted properties will be ignored and remain unchanged. Omitted subEvents will also remain unchanged.


        Every subEvent to update requires an `id` property that is an integer that corresponds to their index in the list of subEvents on the parent event. For example `0` for the first subEvent, `1` for the second subEvent, and so on.


        > Note! If you change the `startDate` of a subEvent, the subEvents will be re-ordered on the parent event afterwards because subEvents are always sorted chronologically.


        Only events with calendar type `single` and `multiple` have subEvents, so only events with those calendar types support this endpoint.'
      tags:
      - Events
      responses:
        '204':
          description: No Content. The subEvents have been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitdatabank/calendar-type-not-supported'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example:
                  value:
                    type: https://api.publiq.be/probs/uitdatabank/calendar-type-not-supported
                    title: Calendar type not supported
                    status: 400
                    detail: 'Not allowed to update subEvents on calendar type: "permanent". Only subEvents on single and multiple calendar types can be updated.'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        content:
          application/json:
            schema:
              title: event.subEvent.patch
              type: array
              minItems: 1
              uniqueItems: true
              examples:
              - - id: 0
                  startDate: '2021-05-17T16:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
              - - id: 0
                  startDate: '2021-05-17T16:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
                - id: 1
                  status:
                    type: Unavailable
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Index of the subEvent to update on the parent event. `0` for the first subEvent, `1` for the second event, and so on.
                    example: 0
                  startDate:
                    type: string
                    format: date-time
                    example: '2021-05-17T22:00:00+00:00'
                    description: The date & time that the subEvent starts.
                  endDate:
                    type: string
                    format: date-time
                    example: '2021-05-17T22:00:00+00:00'
                    description: The date & time that the subEvent ends.
                  status:
                    type: object
                    description: Indicates if the subEvent is still happening as scheduled or not.
                    properties:
                      type:
                        type: string
                        example: Available
                        description: 'Required if `status` is included.

                          One of three possible status types.


                          - `Available`: The subEvent is happening as scheduled

                          - `TemporarilyUnavailable`: The subEvent will be postponed

                          - `Unavailable`: The subEvent is permanently cancelled'
                        enum:
                        - Available
                        - TemporarilyUnavailable
                        - Unavailable
                      reason:
                        description: The reason of the status on the event, as a localized human-readable text.
                        type: object
                        properties:
                          nl:
                            type: string
                            description: Dutch reason
                            example: Nederlandse reden
                          fr:
                            type: string
                            description: French reason
                            example: Raison français
                          de:
                            type: string
                            description: German reason
                            example: Deutscher Grund
                          en:
                            type: string
                            description: English reason
                            example: English reason
                    required:
                    - type
                  bookingAvailability:
                    type: object
                    description: Indicates if the subEvent still has tickets or places available for booking.
                    properties:
                      type:
                        type: string
                        enum:
                        - Available
                        - Unavailable
                        description: 'Required if bookingAvailability is included.


                          One of two possible booking availability types.


                          - `Available`: The subEvent still has tickets or places available.

                          - `Unavailable`: The subEvent has no more tickets or places available.'
                        example: Available
                    required:
                    - type
                required:
                - id
            examples:
              Updating the dates of the first subEvent:
                value:
                - id: 0
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
              Updating the status of the second subEvent:
                value:
                - id: 1
                  status:
                    type: Unavailable
                    reason:
                      nl: Afgelast wegens corona
              Updating the booking availability of the third subEvent:
                value:
                - id: 2
                  bookingAvailability:
                    type: Unavailable
              Updating multiple:
                value:
                - id: 0
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                - id: 1
                  status:
                    type: Unavailable
                    reason:
                      nl: Afgelast wegens corona
                - id: 2
                  bookingAvailability:
                    type: Unavailable
        description: "The subEvents to update, with the properties to update. \n\nEach subEvent must have an `id` property to indicate which subEvent should be updated. This `id` is the position of the subEvent in the list of subEvents on the parent event. For example `0` for the first subEvent, `1` for the second subEvent, and so on.\n\nAll other properties are optional, and only properties that are included will be updated. No subEvents or properties will be removed."
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
