                    labels:
                      title: event.labels
                      description: 'One or more labels that categorize the [event](./models/event.json). Compared to [terms](./models/event-terms.json), labels do not have a defined set of possible values or a hierarchy.


                        Labels are allowed to be visible for end users on publication channels.


                        See [hiddenLabels](./models/event-hiddenLabels.json) for labels that should not be visible on publication channels.'
                      type: array
                      items:
                        title: label
                        description: String of 2-255 characters. Can contain any characters except for semicolons (`;`).
                        type: string
                        minLength: 2
                        maxLength: 255
                        pattern: ^(?=.{2,255}$)(?=.*\S.*\S.*)[^;]*$
                        examples:
