openapi: 3.2.0
info:
  title: Publiq Events API
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Events across 2 of this provider''s published API definitions: publiq-uitdatabank-entry-openapi.yml, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://io-test.uitdatabank.be
  description: Testing
- url: https://io.uitdatabank.be
  description: Production
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Events
paths:
  /events:
    post:
      summary: event - create
      tags:
      - Events
      responses:
        '201':
          description: The event was successfully created.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    description: UUID of the created event to use in subsequent requests or to store as a reference in your application.
                  eventId:
                    type: string
                    format: uuid
                    deprecated: true
                    description: Deprecated, use `id` instead.
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                    description: URL of the created event to use in subsequent requests or to store as a reference in your application.
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - eventId
                - url
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: event-post
      description: 'Creates a new event with the required properties and any additional optional properties.


        By default, the new event will be editable and removable by the user or client that the access token used to perform this request belongs to. If you use a user access token, the user for which the token was obtained will see the new event in their dashboard in UiTdatabank and will be able to edit or remove it. If you use a client access token, only API requests with a token for the same client will be able to edit or remove it.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: 'The complete details of the new event to create. The schema of the event is the same as the response of the [`GET /events/{eventId}`](./entry.json/paths/~1events~1{eventId}/get) operation.


          This request also supports an older deprecated schema that was used to create an event with just its required fields. If you have an existing integration that still uses this schema, you can view it by switching from the `event` schema to `event.post (deprecated)` below.'
        content:
          application/json:
            schema:
              anyOf:
              - type: object
                title: event
                description: 'A cultural, sport, or pastime activity.


                  For more information: <a href="https://docs.publiq.be/docs/uitdatabank/entry-api/events/what-are-events">What are events?</a>'
                allOf:
                - properties:
                    '@id':
                      title: event.@id
                      type: string
                      format: uri
                      pattern: ^http[s]?:\/\/.+?\/event[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                      description: A unique URI that acts as globally unique ID for the [event](./models/event.json). Based on [JSON-LD node identifiers](https://www.w3.org/TR/json-ld/#node-identifiers).
                      examples:
                      - https://io-test.uitdatabank.be/events/85b04295-479c-40f5-b3dd-469dfb4387b3
                    mainLanguage:
                      title: event.mainLanguage
                      description: 'The main language that the [event](./models/event.json) is described in. All localized properties like [name](./models/event-name.json) and [description](./models/event-description.json) will be required to have at least a value for this language.


                        Can be one of `nl`, `fr`, `de`, or `en`.'
                      type: string
                      enum:
                      - nl
                      - fr
                      - de
                      - en
                    name:
                      type: object
                      title: event.name
                      description: 'The human-readable, localized name of the [event](./models/event.json).


                        Requires at least one value, for the language specified in the [mainLanguage](./models/event-mainLanguage.json) property.'
                      minProperties: 1
                      properties:
                        nl:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `nl` (Dutch) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        fr:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `fr` (French) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        de:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `de` (German) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        en:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `en` (English) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                      examples:
                      - nl: Voorbeeld van een naam
                        fr: Exemple d'un nom
                        de: Beispiel eines Namens
                        en: Example of a name
                      minLength: 1
                      maxLength: 90
                    terms:
                      type: array
                      title: event.terms
                      description: 'A list of taxonomy terms used to categorize the [event](./models/event.json).


                        Terms are pre-defined and can be found using our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).


                        An event requires at least one term, to define its type. (For example a concert, theater show, ...)'
                      uniqueItems: true
                      minItems: 1
                      contains:
                        properties:
                          domain:
                            const: eventtype
                      minContains: 1
                      maxContains: 1
                      items:
                        title: ''
                        type: object
                        description: 'A taxonomy term used to categorize events.


                          All events require exactly one term of the `eventtype` domain, and can optionally contain other terms.


                          When reading events, all properties will be available. When creating or updating events only the `id` is required to be included.'
                        examples:
                        - id: 0.50.4.0.0
                          label: Concert
                          domain: eventtype
                        properties:
                          id:
                            type: string
                            description: Unique id of the term. For example `0.50.4.0.0`.
                            example: 0.50.4.0.0
                          label:
                            type: string
                            description: Human-readable label of the term. Currently only available in Dutch. For example `Concert`.
                            example: Concert
                          domain:
                            type: string
                            example: eventtype
                            description: The domain of the term. Can be one of `eventtype`, `theme`, or `facility`.
                            enum:
                            - eventtype
                            - theme
                            - facility
                        required:
                        - id
                      examples:
                      - - id: 0.50.4.0.0
                          label: Concert
                          domain: eventtype
                    location:
                      type: object
                      title: event.location
                      description: A reference to a [place](./models/place.json) linked to the event. When writing an event it should only contain an `@id` property. When reading an event it will contain all the properties from the [place](./models/place.json). Always required when creating/updating an event, except when using [attendanceMode](./models/event-attendanceMode.json) `online`.
                      examples:
                      - '@id': https://io-test.uitdatabank.be/places/5cf42d51-3a4f-46f0-a8af-1cf672be8c84
                      properties:
                        '@id':
                          title: place.@id
                          type: string
                          format: uri
                          pattern: ^http[s]?:\/\/.+?\/place[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                          description: A unique URI that acts as globally unique ID for the [place](./models/place.json). Based on (JSON-LD node identifiers)[https://www.w3.org/TR/json-ld/#node-identifiers].
                          examples:
                          - https://io-test.uitdatabank.be/places/85b04295-479c-40f5-b3dd-469dfb4387b3
                      required:
                      - '@id'
                    calendarType:
                      type: string
                      title: event.calendarType
                      description: 'Determines how often the [event](./models/event.json) occurs.


                        Possible values: `single`, `multiple`, `periodic`, `permanent`.


                        - **single**: For events that take place at one single day (e.g. a concert of Radiohead) and events with only one start and end date (e.g. camping from monday until sunday). **Must** have 1 [subEvent](./models/event-subEvent.json). Will automatically get a [startDate](./models/event-startDate.json) and [endDate](./models/event-endDate.json) based on the `subEvent`.


                        - **multiple**: For events that take place on several occasions, whether or not contiguous (e.g. a festival). **Must** have 2+ [subEvents](./models/event-subEvent.json). Will automatically get a [startDate](./models/event-startDate.json) and [endDate](./models/event-endDate.json) based on the `subEvents`.


                        - **periodic**: For events that take places on recurring moments (e.g. a course watercolor painting, each wednesday evening). **Must** have a [startDate](./models/event-startDate.json) and [endDate](./models/event-endDate.json). Can optionally have [openingHours](./models/event-openingHours.json).


                        - **permanent**: Not recommended for events, consider creating a [place](./models/place.json) instead. Can optionally have [openingHours](./models/event-openingHours.json). [Here is a detailed guide](./entry-api/shared/calendar-info#calendartype) with more information.'
                      enum:
                      - single
                      - multiple
                      - periodic
                      - permanent
                      examples:
                      - single
                    startDate:
                      title: event.startDate
                      description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) starts, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                        Required on events when using one of the following calendarTypes:


                        - `single`

                        - `multiple`

                        - `periodic`


                        Always required on subEvents.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    endDate:
                      title: event.endDate
                      description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) ends, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                        Required on events when using one of the following calendarTypes:


                        - `single`

                        - `multiple`

                        - `periodic`


                        Always required on subEvents.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    attendanceMode:
                      title: event.attendanceMode
                      type: string
                      description: Indicates if the [event](./models/event.json) is happening online, offline, or both (mixed).
                      enum:
                      - online
                      - offline
                      - mixed
                    onlineUrl:
                      title: event.onlineUrl
                      description: The url to follow the [event](./models/event.json) online.
                      type: string
                      format: uri
                      pattern: ^http[s]?:\/\/\w
                      examples: []
                    status:
                      title: event.status
                      description: Indicates if the [event](./models/event.json) is still happening as scheduled or not.
                      type: object
                      properties:
                        type:
                          enum:
                          - Available
                          - TemporarilyUnavailable
                          - Unavailable
                          example: Available
                          description: 'One of three possible status types.


                            - `Available`: Happening or open as scheduled

                            - `TemporarilyUnavailable`: Postponed or temporarily closed

                            - `Unavailable`: Cancelled or permanently closed'
                          type: string
                        reason:
                          description: The reason of the status, as a localized human-readable text.
                          type: object
                          examples:
                          - nl: Nederlandse tekst
                            fr: Texte français
                            de: Deutscher Text
                            en: English text
                          properties:
                            nl:
                              type: string
                              description: Dutch reason
                              example: Nederlandse reden
                              pattern: \S
                              minLength: 1
                            fr:
                              type: string
                              description: French reason
                              example: Raison français
                              pattern: \S
                              minLength: 1
                            de:
                              type: string
                              description: German reason
                              example: Deutscher Grund
                              pattern: \S
                              minLength: 1
                            en:
                              type: string
                              description: English reason
                              example: English reason
                              pattern: \S
                              minLength: 1
                      required:
                      - type
                      examples:
                      - type: Available
                      - type: TemporarilyUnavailable
                        reason:
                          nl: Uitgesteld wegens covid-19
                          en: Postponed due to covid-19
                      - type: Unavailable
                        reason:
                          nl: Permanent gesloten
                    subEvent:
                      title: event.subEvent
                      type: array
                      description: A list of occurrences of the [event](./models/event.json) when using the `single` or `multiple` [calendarType](./models/event-calendarType.json).
                      examples:
                      - - id: 0
                          startDate: '2021-05-17T16:00:00+00:00'
                          endDate: '2021-05-17T22:00:00+00:00'
                          status:
                            type: Available
                          bookingAvailability:
                            type: Available
                      - - id: 0
                          startDate: '2021-05-17T16:00:00+00:00'
                          endDate: '2021-05-17T22:00:00+00:00'
                          status:
                            type: Available
                          bookingAvailability:
                            type: Available
                        - id: 1
                          startDate: '2021-05-20T16:00:00+00:00'
                          endDate: '2021-05-20T22:00:00+00:00'
                          status:
                            type: Available
                          bookingAvailability:
                            type: Unavailable
                      minItems: 1
                      items:
                        type: object
                        properties:
                          id:
                            type: integer
                            description: Index of the subEvent on the parent event. `0` for the first subEvent, `1` for the second event, and so on.
                            example: 0
                          startDate:
                            title: event.startDate
                            description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) starts, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                              Required on events when using one of the following calendarTypes:


                              - `single`

                              - `multiple`

                              - `periodic`


                              Always required on subEvents.'
                            type: string
                            format: date-time
                            examples:
                            - '2021-05-17T22:00:00+00:00'
                          endDate:
                            title: event.endDate
                            description: 'The date & time that the [event](./models/event.json) or [subEvent](./models/event-subEvent.json) ends, as an ISO-8601 date. For example `2021-05-17T22:00:00+00:00`.


                              Required on events when using one of the following calendarTypes:


                              - `single`

                              - `multiple`

                              - `periodic`


                              Always required on subEvents.'
                            type: string
                            format: date-time
                            examples:
                            - '2021-05-17T22:00:00+00:00'
                          status:
                            title: event.status
                            description: Indicates if the [event](./models/event.json) is still happening as scheduled or not.
                            type: object
                            properties:
                              type:
                                enum:
                                - Available
                                - TemporarilyUnavailable
                                - Unavailable
                                example: Available
                                description: 'One of three possible status types.


                                  - `Available`: Happening or open as scheduled

                                  - `TemporarilyUnavailable`: Postponed or temporarily closed

                                  - `Unavailable`: Cancelled or permanently closed'
                                type: string
                              reason:
                                description: The reason of the status, as a localized human-readable text.
                                type: object
                                examples:
                                - nl: Nederlandse tekst
                                  fr: Texte français
                                  de: Deutscher Text
                                  en: English text
                                properties:
                                  nl:
                                    type: string
                                    description: Dutch reason
                                    example: Nederlandse reden
                                    pattern: \S
                                    minLength: 1
                                  fr:
                                    type: string
                                    description: French reason
                                    example: Raison français
                                    pattern: \S
                                    minLength: 1
                                  de:
                                    type: string
                                    description: German reason
                                    example: Deutscher Grund
                                    pattern: \S
                                    minLength: 1
                                  en:
                                    type: string
                                    description: English reason
                                    example: English reason
                                    pattern: \S
                                    minLength: 1
                            required:
                            - type
                            examples:
                            - type: Available
                            - type: TemporarilyUnavailable
                              reason:
                                nl: Uitgesteld wegens covid-19
                                en: Postponed due to covid-19
                            - type: Unavailable
                              reason:
                                nl: Permanent gesloten
                          bookingAvailability:
                            title: event.subEvent.bookingAvailability
                            type: object
                            description: Indicates whether the subevent still has tickets or reservations available. Currently contains a `type` that can be `Available` or `Unavailable`.
                            properties:
                              type:
                                type: string
                                enum:
                                - Available
                                - Unavailable
                                description: 'One of two possible types.


                                  - `Available`: Tickets or reservations available

                                  - `Unavailable`: No more tickets or reservations available.'
                            required:
                            - type
                        required:
                        - startDate
                        - endDate
                    openingHours:
                      title: event.openingHours
                      description: A list of multiple open/closed times and weekdays indicating when the event is happening when using the `periodic` calendarType.
                      type: array
                      items:
                        type: object
                        examples:
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                        properties:
                          opens:
                            type: string
                            description: Opening time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          closes:
                            type: string
                            description: Closing time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          dayOfWeek:
                            type: array
                            uniqueItems: true
                            minItems: 1
                            description: One or more weekdays that the open/closing times are applicable for.
                            items:
                              type: string
                              enum:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                              - sunday
                              description: A single weekday.
                        required:
                        - opens
                        - closes
                        - dayOfWeek
                      examples:
                      - - opens: '13:00'
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                    availableFrom:
                      title: event.availableFrom
                      description: 'The first date & time that the [event](./models/event.json) is allowed to be visible on publication channels.


                        Formatted as an ISO-8601 datetime. For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    availableTo:
                      title: event.availableTo
                      description: 'The last date & time that the [event](./models/event.json) is allowed to be visible on publication channels.


                        Added automatically by UiTdatabank based on either the [startDate](./models/event-startDate.json) or [endDate](./models/event-endDate.json) depending on the [event type](./models/event-terms.json).


                        Formatted as an ISO-8601 datetime. For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      readOnly: true
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    organizer:
                      type: object
                      title: event.organizer
                      description: A reference to an [organizer](./models/organizer.json) linked to the event. When writing an event it should only contain an `@id` property. When reading an event it will contain all the properties from the [organizer](./models/organizer.json).
                      examples:
                      - '@id': https://io-test.uitdatabank.be/organizers/5cf42d51-3a4f-46f0-a8af-1cf672be8c84
                      properties:
                        '@id':
                          title: organizer.@id
                          type: string
                          format: uri
                          description: A unique URI that acts as globally unique ID for the [organizer](./models/organizer.json). Based on [JSON-LD node identifiers](https://www.w3.org/TR/json-ld/#node-identifiers).
                          examples:
                          - https://io-test.uitdatabank.be/organizers/5cf42d51-3a4f-46f0-a8af-1cf672be8c84
                          pattern: ^http[s]?:\/\/.+?\/organizer[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                      required:
                      - '@id'
                    sameAs:
                      type: array
                      title: event.sameAs
                      description: 'One or more URIs that represent the same [event](./models/event.json) on another API or website, not necessarily in JSON-LD format.


                        Added automatically by UiTdatabank based on info from other systems.


                        For example `http://www.uitinvlaanderen.be/agenda/e/test-event/85b04295-479c-40f5-b3dd-469dfb4387b3`.'
                      uniqueItems: true
                      minItems: 1
                      examples:
                      - - http://www.uitinvlaanderen.be/agenda/e/example/85b04295-479c-40f5-b3dd-469dfb4387b3
                      items:
                        title: uri
                        description: A URI with the HTTP or HTTPS protocol.
                        type: string
                        format: uri
                        pattern: ^http[s]?:\/\/\w
                        examples:
                        - https://www.example.com
                      readOnly: true
                    workflowStatus:
                      title: event.workflowStatus
                      type: string
                      description: 'The status in the moderation workflow.


                        Can be one of four types:


                        - `DRAFT`: Should not be visible on publication channels yet

                        - `READY_FOR_VALIDATION`: Submitted for validation. Some publication channels may choose to show these.

                        - `APPROVED`: Approved, will be visible on all publication channels (depending on the `availableFrom` and `availableTo`). Only possible if you have moderation permissions.

                        - `REJECTED`: Rejected, will be hidden from all publication channels. Only possible if you have moderation permissions.

                        - `DELETED`: Removed and should not be visible on any publication channels.'
                      enum:
                      - DRAFT
                      - READY_FOR_VALIDATION
                      - APPROVED
                      - REJECTED
                      - DELETED
                      examples:
                      - DRAFT
                    audience:
                      title: event.audience
                      type: object
                      description: Indicates the intended audience of the [event](./models/event.json).
                      examples:
                      - audienceType: everyone
                      - audienceType: members
                      - audienceType: education
                      properties:
                        audienceType:
                          type: string
                          enum:
                          - everyone
                          - members
                          - education
                          description: Indicates whether the event or place is accessible to `everyone`, `members` only or `education` only.
                      required:
                      - audienceType
                    languages:
                      type: array
                      title: event.languages
                      description: 'List of languages that the [event](./models/event.json) is available in. (Not all localizable properties may contain every language though)


                        Added automatically by UiTdatabank based on the languages present in localized properties.


                        See also [completedLanguages](./models/event-completedLanguages.json).'
                      readOnly: true
                      minItems: 1
                      items:
                        type: string
                        enum:
                        - nl
                        - fr
                        - de
                        - en
                        example: nl
                      examples:
                      - - nl
                        - fr
                    completedLanguages:
                      type: array
                      title: event.completedLanguages
                      description: 'List of languages that _every_ localizable property on the [event](./models/event.json) is available in.


                        Added automatically by UiTdatabank based on the languages present in localized properties.


                        See also [languages](./models/event-languages.json).'
