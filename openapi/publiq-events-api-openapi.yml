        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: event-workflow-status-put
      description: 'Updates the workflow status of an event. Possible statuses are:


        - `DRAFT`: The default status of new events. Events with this status do not appear in online calendars like or the search on

        - `READY_FOR_VALIDATION`: This status means the event has been published, but not approved yet. Most online calendars will already show it, and it will appear in the search on

        - `APPROVED`: The event has been approved by a moderator. It will appear on all online calendars. You cannot set this status unless you have moderation permissions.

        - `REJECTED`: The event has been rejected by a moderator. It will not appear on any online calendars. You cannot set this status unless you have moderation permissions.

        - `DELETED`: The event has been deleted. It will not appear on any online calendars.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              title: event.workflowStatus.put
              type: object
              properties:
                workflowStatus:
                  title: event.workflowStatus
                  type: string
                  description: 'The status in the moderation workflow.


                    Can be one of four types:


                    - `DRAFT`: Should not be visible on publication channels yet

                    - `READY_FOR_VALIDATION`: Submitted for validation. Some publication channels may choose to show these.

                    - `APPROVED`: Approved, will be visible on all publication channels (depending on the `availableFrom` and `availableTo`). Only possible if you have moderation permissions.

                    - `REJECTED`: Rejected, will be hidden from all publication channels. Only possible if you have moderation permissions.

                    - `DELETED`: Removed and should not be visible on any publication channels.'
                  enum:
                  - DRAFT
                  - READY_FOR_VALIDATION
                  - APPROVED
                  - REJECTED
                  - DELETED
                  examples:
                  - DRAFT
                availableFrom:
                  title: event.availableFrom
                  description: Can be set when changing the workflowStatus to `READY_FOR_VALIDATION`. The first date & time that the [event](./models/event.json) is allowed to be visible on publication channels. If omitted when changing the workflowStatus to `READY_FOR_VALIDATION`, the current datetime will be used. Must be formatted as an ISO-8601 datetime.
                  type: string
                  format: date-time
                  examples:
                  - '2021-05-17T22:00:00+00:00'
                reason:
                  type: string
                  description: Required when setting the workflowStatus to `REJECTED` (only possible with permission to moderate events). The reason why the event was rejected.
              required:
              - workflowStatus
              if:
                properties:
                  workflowStatus:
                    const: REJECTED
              then:
                required:
                - reason
              examples:
              - workflowStatus: READY_FOR_VALIDATION
                availableFrom: '2023-05-17T12:30:00+02:00'
            examples: {}
        description: New workflowStatus to set on the event. Depending on the new workflowStatus, other properties may/must be set as well.
    servers:
