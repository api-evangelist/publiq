                  calendarType: permanent
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
