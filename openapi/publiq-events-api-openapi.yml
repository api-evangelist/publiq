      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A human-readable name in the main language of the event.
                type:
                  type: string
                  description: The `eventtype` term used to categorize the event. Terms are pre-defined and can be browsed in our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).
                theme:
                  type: string
                  description: The `theme` term used to categorize the event. Terms are pre-defined and can be browsed in our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).
                location:
                  type: object
                  description: Reference to the location that the event is taking place at.
                  required:
                  - id
                  properties:
                    id:
                      type: string
                      description: UUID of the location that the event is taking place at.
                calendar:
