                      type: string
                      minLength: 2
                      maxLength: 255
                      pattern: ^(?=.{2,255}$)(?=.*\S.*\S.*)[^;]*$
                      examples:
                      - example label 12345!
                    uniqueItems: true
                    minItems: 1
                    examples:
                    - - example label with spaces
                      - underscores_are_valid
