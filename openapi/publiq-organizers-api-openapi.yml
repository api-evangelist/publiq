            examples:
              Example:
                value:
                  email: newadmin@example.com
                  type: ADMIN
        description: Request body with the email of the new organizer admin.
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
