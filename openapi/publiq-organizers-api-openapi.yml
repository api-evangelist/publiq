openapi: 3.2.0
info:
  title: Publiq Organizers API
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Organizers across 6 of this provider''s published API definitions: uitdatabank-entry.json, uitdatabank-search.json, uitpas-uitpas.json, publiq-uitdatabank-entry-openapi.yml, publiq-uitdatabank-search-openapi.yml, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://io-test.uitdatabank.be
  description: Testing
- url: https://io.uitdatabank.be
  description: Production
- url: https://search-test.uitdatabank.be
  description: Testing
- description: Production
  url: https://search.uitdatabank.be
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Organizers
paths:
  /organizers:
    post:
      summary: organizer - create
      description: 'Creates a new organizer.


        > Organizers are required to have a unique `url` value to avoid accidental duplicate organizers.


        > This request is also supported with an older, deprecated schema that was used to create an organizer with just its required fields.'
      operationId: organizer-post
      tags:
      - Organizers
      responses:
        '201':
          description: The organizer has been created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of newly created organizer.
                  organizerId:
                    type: string
                    description: The id of newly created organizer. (Deprecated in favor of `id`.)
                    deprecated: true
                  url:
                    type: string
                    description: The url of the JSON-LD data of the newly created organizer.
                required:
                - id
                - organizerId
                - url
              examples:
                Example:
                  value:
                    id: 6b476d79-c404-425f-8b1c-357e39a60410
                    organizerId: 6b476d79-c404-425f-8b1c-357e39a60410
                    url: https://io-test.uitdatabank.be/organizers/6b476d79-c404-425f-8b1c-357e39a60410
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitdatabank/duplicate-url'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      requestBody:
        description: The complete details of the new organizer to create.
        content:
          application/json:
            schema:
              anyOf:
              - $ref: ../models/organizer.json
              - $ref: ../models/organizer-post-deprecated.json
            examples:
              Organizer with all possible fields:
                value:
                  mainLanguage: nl
                  name:
                    nl: Nederlandse naam
                  url: https://www.publiq.be
                  address:
                    nl:
                      addressCountry: BE
                      addressLocality: Brussel
                      postalCode: '1000'
                      streetAddress: Wetstraat 1
                  contactPoint:
                    phone:
                    - +32/1234567890
                    email:
                    - info@publiq.be
                    url:
                    - https://www.publiq.be
                  labels:
                  - label1
                  - label2
                  hiddenLabels:
                  - labelA
                  - labelB
                  images:
                  - '@id': https://io-test.uitdatabank.be/images/74969172-E2A6-4626-BA63-4B6919242A24
                  - '@id': https://io-test.uitdatabank.be/images/85b04295-479c-40f5-b3dd-469dfb4387b3
                    description: optional overwritten description
                    copyrightHolder: optional overwritten copyright holder
                    inLanguage: nl
              Organizer with only required fields:
                value:
                  mainLanguage: nl
                  name:
                    nl: Nederlandse naam
                  url: https://www.publiq.be
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    parameters: []
    get:
      summary: Search organizers
      tags:
      - Organizers
      responses:
        '200':
          description: A single page of search results. If `?embed=true` is used, the search results will contain the complete JSON details. Otherwise only `@id` and `@type` will be returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  itemsPerPage:
                    type: integer
                    example: 30
                    description: The amount of results that is being returned per page.
                  totalItems:
                    type: integer
                    example: 2345
                    description: Total amount of results for the given query parameters.
                  member:
                    type: array
                    description: Search results (paginated). Note that the complete search results details will only be returned if `?embed=true` is used. Otherwise only the `@id` will be returned.
                    items:
                      $ref: ../models/organizer.json
                  facet:
                    type: object
                    description: Facet counts per possible filter & value.
                    properties:
                      regions:
                        $ref: ../models/common-facets.json
                required:
                - itemsPerPage
                - totalItems
                - member
              examples:
                Example:
                  value:
                    itemsPerPage: 20
                    totalItems: 3
                    member:
                    - '@id': https://io-test.uitdatabank.be/organizers/7dc08012-488b-4e2b-b318-625d9bce03d7
                      '@type': Organizer
                    - '@id': https://io-test.uitdatabank.be/organizers/c683ddfe-4ff9-4b4b-a198-b9f553cfc479
                      '@type': Organizer
                    - '@id': https://io-test.uitdatabank.be/organizers/15d5de07-57e6-4015-84c6-e9c94ccfd9ef
                      '@type': Organizer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: get-organizers
      description: 'Returns a paginated list of organizers that match the given filters.


        ### Repeating query parameters


        Parameters that have the type `array[string]` and `[]` as a suffix in their name in the list of query parameters below can be repeated to filter on multiple values with an `AND` operator. For example:


        * `?labels[]=uitpas` to only include results that have the label `uitpas`

        * `?labels[]=uitpas&labels[]=paspartoe` to only include results that have both the labels `uitpas` and `paspartoe`'
      parameters:
      - $ref: '#/components/parameters/x-client-id'
      - $ref: '#/components/parameters/x-api-key'
      - $ref: '#/components/parameters/q'
      - $ref: '#/components/parameters/name'
      - $ref: '#/components/parameters/website'
      - $ref: '#/components/parameters/id'
      - $ref: '#/components/parameters/domain'
      - $ref: '#/components/parameters/postalCode'
      - $ref: '#/components/parameters/addressCountry'
      - $ref: '#/components/parameters/creator'
      - $ref: '#/components/parameters/contributors'
      - $ref: '#/components/parameters/facets'
      - $ref: '#/components/parameters/regions'
      - $ref: '#/components/parameters/coordinates'
      - $ref: '#/components/parameters/embed'
      - $ref: '#/components/parameters/distance'
      - $ref: '#/components/parameters/bounds'
      - $ref: '#/components/parameters/labels'
      - $ref: '#/components/parameters/hasImages'
      - $ref: '#/components/parameters/workflowStatusOrganizer'
      - $ref: '#/components/parameters/sortScore'
      - $ref: '#/components/parameters/sortCreated'
      - $ref: '#/components/parameters/sortModified'
      security:
      - CLIENT_IDENTIFICATION: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    get:
      summary: organizer - get
      operationId: organizer-get
      responses:
        '200':
          description: Organizer details
          content:
            application/json:
              schema:
                $ref: ../models/organizer-with-read-example.json
        '404':
          $ref: '#/components/responses/NotFound'
      description: Returns an the organizer with the given `organizerId`
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Organizers
    put:
      summary: organizer - update
      operationId: organizer-put
      responses:
        '200':
          description: The organizer has been updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the updated organizer.
                  organizerId:
                    type: string
                    description: The id of the updated organizer. (Deprecated in favor of `id`.)
                    deprecated: true
                  url:
                    type: string
                    description: The url of the JSON-LD data of the updated organizer.
                required:
                - id
                - organizerId
                - url
              examples:
                Example:
                  value:
                    id: 6b476d79-c404-425f-8b1c-357e39a60410
                    organizerId: 6b476d79-c404-425f-8b1c-357e39a60410
                    url: https://io-test.uitdatabank.be/organizers/6b476d79-c404-425f-8b1c-357e39a60410
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitdatabank/duplicate-url'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Updates the organizer with the given `organizerId` by completely overwriting it with the properties in the given JSON.


        > Any existing (optional) properties on the organizer that are not included in the update request will be removed from the organizer.


        > Certain existing `labels` or `hiddenLabels` may be kept on the organizer even if they are not included in the update request. For example if they were added via the UiTdatabank UI, or if the client or user making the request does not have sufficient permission to remove specific labels.'
      requestBody:
        description: The complete details of the organizer to update.
        content:
          application/json:
            schema:
              $ref: ../models/organizer.json
            examples:
              Organizer with all possible fields:
                value:
                  mainLanguage: nl
                  name:
                    nl: Nederlandse naam
                  url: https://www.publiq.be
                  address:
                    nl:
                      addressCountry: BE
                      addressLocality: Brussel
                      postalCode: '1000'
                      streetAddress: Wetstraat 1
                  contactPoint:
                    phone:
                    - +32/1234567890
                    email:
                    - info@publiq.be
                    url:
                    - https://www.publiq.be
                  labels:
                  - label1
                  - label2
                  hiddenLabels:
                  - labelA
                  - labelB
                  images:
                  - '@id': https://io-test.uitdatabank.be/images/74969172-E2A6-4626-BA63-4B6919242A24
                  - '@id': https://io-test.uitdatabank.be/images/85b04295-479c-40f5-b3dd-469dfb4387b3
                    description: optional overwritten description
                    copyrightHolder: optional overwritten copyright holder
                    inLanguage: nl
              Organizer with only required fields:
                value:
                  mainLanguage: nl
                  name:
                    nl: Nederlandse naam
                  url: https://www.publiq.be
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Organizers
    delete:
      summary: organizer - delete
      description: '> Note: only users with the permissions `Organisaties beheren` can delete an organizer.


        Delete the organizer with the given `organizerId`.'
      operationId: delete-organizer
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer was deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      x-internal: true
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/address/{language}:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    - $ref: '#/components/parameters/language'
    put:
      summary: address - update
      description: 'Updates the address of the organizer with the given `organizerId`. The new address of the request body will be set on the organizer in the given `language`.


        An address consists of the following properties which are all required:

        * streetAddress: the street name and street number

        * postalCode: the postal code

        * addressLocality: the town or city

        * addressCountry: the 2-character country code'
      operationId: organizer-address-put
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer address has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (streetAddress) are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        description: New address to set on the organizer (localized in the given language in the URL).
        content:
          application/json:
            schema:
              $ref: ../models/organizer-address-put.json
            examples:
              Example:
                value:
                  streetAddress: Kerkstraat 2
                  postalCode: '3000'
                  addressLocality: Leuven
                  addressCountry: BE
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/address:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    put:
      summary: address.nl - update
      description: '> This endpoint is deprecated, use `PUT /organizers/{organizerId}/address/{language}` instead.


        Updates the address of the organizer with the given `organizerId`. The new address of the request body will be set on the organizer in the default language `nl`.


        An address consists of the following properties which are all required:

        * streetAddress: the street name and street number

        * postalCode: the postal code

        * addressLocality: the town or city

        * addressCountry: the 2-character country code'
      operationId: organizer-address-nl-put
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer address has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (streetAddress) are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        description: New address to set on the organizer (localized in the `nl` language).
        content:
          application/json:
            schema:
              $ref: ../models/organizer-address-put.json
            examples:
              Example:
                value:
                  streetAddress: Kerkstraat 2
                  postalCode: '3000'
                  addressLocality: Leuven
                  addressCountry: BE
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      deprecated: true
    delete:
      summary: address - delete
      description: Delete the address of the organizer with the given `organizerId`.
      operationId: organizer-address-delete
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer address has been deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      x-internal: true
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/contact-point:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    put:
      summary: contactPoint - update
      description: 'Updates the contact point information of the organizer with the given `organizerId`. A contact point has a list of the following properties:

        * Url: an array of valid urls

        * Email: an array of valid emails

        * Phone: an array of phone numbers


        All properties are optional.'
      operationId: organizer-contactPoint-put
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer contact point has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        description: New contact point to set on the organizer.
        content:
          application/json:
            schema:
              $ref: ../models/organizer-contactPoint-put.json
            examples:
              Update multiple values:
                value:
                  url:
                  - https://www.publiq.be
                  - https://www.cultuurnet.be
                  email:
                  - info@publiq.be
                  - info@cultuurnet.be
                  phone:
                  - 016 10 20 30
                  - 016 11 22 33
                  - 016 99 99 99
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/contributors:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    get:
      summary: contributors - get
      operationId: organizer-contributors-get
      responses:
        '200':
          description: An array of contributors.
          content:
            application/json:
              schema:
                $ref: ../models/common-contributors.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Organizers
      description: Returns a JSON array of contributors, meaning users that have edit rights on the organizer.
      x-internal: true
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    put:
      summary: contributors - update
      operationId: organizer-contributors-put
      responses:
        '204':
          description: No Content. The contributors have been successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Example:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Organizers
      description: Updates the list of contributors on the organizer. These users will have edit rights on the organizer.
      x-internal: true
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/organizer-contributors-put.json
            examples:
              Example:
                value:
                - info@publiq.be
                - vragen@publiq.be
        description: New list of contributors of the organizer. Previous contributors of the organizer that are not included in this list will be removed.
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/description/{language}:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    - $ref: '#/components/parameters/language'
    put:
      summary: description - update
      description: Updates the description of the organizer with the given `organizerId`. The new description of the request body will be set on the organizer in the given `language`. The new description needs to be at least one character long.
      operationId: organizer-description-put
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer description has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (description) are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        description: New description to set on the organizer (localized in the given language in the URL).
        content:
          application/json:
            schema:
              $ref: ../models/organizer-description-put.json
            examples:
              Example:
                value:
                  description: This organizer is responsible for creating cultural events for schools around Brussels.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    delete:
      summary: description - delete
      operationId: organizer-description-delete
      responses:
        '204':
          description: No Content. The description was deleted.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      tags:
      - Organizers
      description: Deletes the description in the given `language` from the organizer with the given `organizerId`.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /organizers/{organizerId}/educational-description/{language}:
    parameters:
    - $ref: '#/components/parameters/organizerId'
    - $ref: '#/components/parameters/language'
    put:
      summary: educational description - update
      description: Updates the educational description of the organizer with the given `organizerId`. The new educational description of the request body will be set on the organizer in the given `language`. The new educational description needs to be at least one character long.
      operationId: organizer-educational-description-put
      tags:
      - Organizers
      responses:
        '204':
          description: No Content. The organizer educational description has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
