                    icon: https://www.uitpas.be/_nuxt/img/icon2.png
                    mainFamilyMember: false
                  - uitpasNumber: 0900000036112
                    creationDate: '2023-08-24T14:18:22+00:00'
                    passholder:
                      id: 3be0fb53-0695-405b-ac09-deafead650af
