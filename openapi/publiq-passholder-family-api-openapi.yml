                        city: Aalst
                      creationDate: '2012-08-24T14:15:22+00:00'
                      registrationOrganizer:
                        id: '1234'
                        name: Example UiTPAS Organizer
                      points: 1
                      uitidStatus: UNREGISTERED
                      uitpasNumber: 0900000036112
                      cardSystemMemberships:
                      - cardSystem:
                          id: 1
