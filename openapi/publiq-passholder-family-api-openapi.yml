openapi: 3.2.0
info:
  title: Publiq Passholder Family API
  version: '4.0'
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Passholder Family across 2 of this provider''s published API definitions: uitpas-uitpas.json, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Passholder Family
paths:
  /passholders/{passholderId}/family-members:
    parameters:
    - schema:
        type: string
      name: passholderId
      in: path
      required: true
      description: Passholder ID of the main family member
    get:
      summary: Retrieve family members of the current passholder
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FamilyMember'
              examples:
                Multiple family members:
                  value:
