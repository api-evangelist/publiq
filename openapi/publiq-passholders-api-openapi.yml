components:
  schemas:
    Error:
      $ref: https://raw.githubusercontent.com/cultuurnet/apidocs/main/projects/errors/models/Error.json
      x-internal: true
    Pass:
      title: Pass
      type: object
      examples:
      - passholderId: 0feb87bd-462d-4f24-a25d-df64ab99300e
        subscriptionEndDate: '2022-08-24'
        visit:
          allowed: true
        firstName: Sophie
        lastName: Peeters
        dateOfBirth: '1992-04-14'
        picture:
          url: https://media.museumpassmusees.be/profile/0feb87bd-462d-4f24-a25d-df64ab99300e.png?token=Zl1icdJnbRygckq8eySn8N4Hc7Ae9t
          expiresAt: '2022-05-24T14:15:22Z'
      - passholderId: 0feb87bd-462d-4f24-a25d-df64ab99300e
        subscriptionEndDate: '2022-01-31'
        visit:
          allowed: false
          reason: EXPIRED
        firstName: Sophie
        lastName: Peeters
        dateOfBirth: '1992-04-14'
        picture:
          url: https://media.museumpassmusees.be/profile/0feb87bd-462d-4f24-a25d-df64ab99300e.png?token=Zl1icdJnbRygckq8eySn8N4Hc7Ae9t
          expiresAt: '2022-05-24T14:15:22Z'
      - passholderId: 0feb87bd-462d-4f24-a25d-df64ab99300e
        subscriptionEndDate: '2022-08-24'
        visit:
          allowed: true
      - passholderId: 0feb87bd-462d-4f24-a25d-df64ab99300e
        subscriptionEndDate: '2022-08-24'
        visit:
          allowed: false
          reason: CARD_BLOCKED
      properties:
        passholderId:
          type: string
          format: uuid
          description: ID of the passholder linked to this pass.
        subscriptionEndDate:
          type: string
          format: date
          description: End date of the museumpass subscription of this pass.
        visit:
          type: object
          required:
          - allowed
          description: Current museum visit information for this pass.
          properties:
            allowed:
              type: boolean
              description: Indicates whether the passholder of this pass is allowed to visit a museum at the time of the request. If this is `true`, a subsequent call to `POST /visits` should succeed. If this is `false`, the client should display an error message, based on the `reason`.
            reason:
              type: string
              enum:
              - EXPIRED
              - MAXIMUM_UNREGISTERED_VISITS_REACHED
              - CARD_BLOCKED
              - PASSHOLDER_BLOCKED
              description: The reason why a visit is currently not allowed. This field is only available when `allowed=false`.
        firstName:
          type: string
          description: 'Firstname of the passholder. **Attention**: this field is not always available.'
        lastName:
          type: string
          description: 'Lastname of the passholder. **Attention**: this field is not always available.'
        dateOfBirth:
          type: string
          format: date
          description: 'Date of birth of the passholder. **Attention**: this field is not always available.'
        picture:
          type: object
          description: 'Picture of the passholder. **Attention**: this field is not always available.'
          properties:
            url:
              type: string
              format: uri
              description: URL to the picture of the passholder. **Important:** This URL can be used without further authentication, but it expires after a certain amount of time. The expirary time can be found in the `picture.expiresAt` field. A new valid url can be easily retrieved by retrieving the `Pass` again.
            expiresAt:
              type: string
              format: date-time
              description: Date after which the picture url will stop working.
          required:
          - url
          - expiresAt
      required:
      - passholderId
      - visit
    Pass_2:
      type: object
      title: Pass
      x-tags:
      - Models
      description: 'The `Pass` entity includes basic information about the UiTPAS and its related `Passholder`.  '
      example:
        passholderId: b34c19fc-bcf9-4d10-aeb2-6bc9efd38b68
        uitpasNumber: '0560002524314'
        passType: INDIVIDUAL
        firstName: Jan
        points: 12
        postalCode: '1000'
        socialTariff:
          status: EXPIRED
          endDate: '2022-12-31T22:59:59'
        messages:
        - level: WARN
          text: Je sociaal tarief is verlopen. Contacteer je UiTPAS balie.
        cardSystem:
          id: 1
          name: UiTPAS Dender
          branding:
            logo: https://www.uitpas.be/_nuxt/img/1351557.svg
            primaryColor: rgba(0,0,0,1.0)
            secondaryColor: rgba(97,166,14,1.0)
          links:
            website: https://www.uitpas.be
          cities:
          - postalCode: '9300'
            name: Aalst
          - postalCode: '9400'
            name: Ninove
          permanent: true
      properties:
        passholderId:
          type: string
          description: ID of the passholder associated with this pass
          readOnly: true
        passType:
          type: string
          x-stoplight:
            id: 5l6ksrclyqezu
          description: Indicates whether this pass belongs to an individual passholder or a group (Grouppas)
          enum:
          - INDIVIDUAL
          - GROUP
          readOnly: true
        uitpasNumber:
          type: string
          description: UiTPAS number of this pass
          readOnly: true
        firstName:
          type: string
          description: First name of the passholder.
        points:
          type: integer
          description: Number of points of the passholder of this pass
          readOnly: true
        postalCode:
          type: string
          description: Postal code of the passholder of this pass
          readOnly: true
        cardSystem:
          $ref: '#/components/schemas/CardSystem'
        socialTariff:
          type: object
          description: Information about the possible social tariff of the passholder. This object is always present, however a passholder is only entitled to social tariff if the `status` property has value `ACTIVE`.
          required:
          - status
          properties:
            status:
              type: string
              enum:
              - ACTIVE
              - EXPIRED
              - NONE
              description: 'Status of the social tariff:

                - `ACTIVE`: the passholder is entitled to social tariff

                - `EXPIRED`: the passholder is NOT entitled to social tariff anymore

                - `NONE`: the passholder is NOT entitled to social tariff'
            endDate:
              type: string
              format: date-time
              description: Exact expiration date of the passholder's entitlement to a social tariff. This property must not be used to determine the social tariff status, because `status` can be `ACTIVE` while the `endDate` is in the past during a 'grace period'. This property is not available when status is `NONE`.
              readOnly: true
        messages:
          type: array
          description: Message that, if present, must be displayed to the user
          items:
            type: object
            properties:
