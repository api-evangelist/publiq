      description: 'Checks what would happen if a new membership were created for the given passholder in the specified card system.


        Use this endpoint before creating the membership with `POST /passholders/{passholderId}/memberships/{cardSystemId}`. It returns one of the following results:


        * `NOT_POSSIBLE`: The passholder already has an identical membership, so no new membership can be created.

        * `NEW_MEMBERSHIP`: The membership can be added without affecting any existing membership.

