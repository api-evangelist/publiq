openapi: 3.2.0
info:
  title: Publiq Passholders API
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  version: '1.0'
  description: 'Operations tagged Passholders across 2 of this provider''s published API definitions: museumpassmusees-partner-api.json, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://partner-api-test.museumpassmusees.be
  description: Testing
- url: https://partner-api.museumpassmusees.be
  description: Production
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Passholders
paths:
  /passes/{cardNumber}:
    parameters:
    - schema:
        type: string
      name: cardNumber
      in: path
      required: true
      description: The card number of the museum pass.
    get:
      summary: Look up pass by card number
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pass'
              examples: {}
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found. Possible error types:


            * https://api.publiq.be/probs/url/not-found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get-passes
      description: 'Retrieve information related to a museum pass.


        Only 2 fields are always available: `passholderId` and `visit`.


        Always use `visit` to determine if the passholder may visit your museum (determined by the client access token used). The `visit.allowed` boolean indicates whether the passholder is allowed to visit your museum at the time of the request. In case that boolean is `false` the `visit.reason` will indicate why that is not possible and you should show a human-readable error message in your app.


        If `visit.allowed` is `true`, you may grant the passholder entry to the museum and register their visit using `POST /visits` with the `passholderId` from the response.


        In most cases `subscriptionEndDate` is also present in the response, but not if the passholder only ever had one active subscription that was later cancelled. Note that this field is purely informational and should never be used to determine if the passholder may visit your museum or not, as other factors may influence this check.


        The other fields like `firstName`, `lastName` and `picture` are present when the passholder has registered their pass online, except if the pass is blocked.


        ## Permissions


        The caller of this request must have the `visit registrar` role.'
      security:
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Passholders
    servers:
    - url: https://partner-api-test.museumpassmusees.be
      description: Testing
    - url: https://partner-api.museumpassmusees.be
      description: Production
  /passholders:
    parameters: []
    get:
      summary: Search passholders
      tags:
      - Passholders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassholdersPaginatedResponse'
              examples:
                Example:
                  value:
                    totalItems: 1
                    member:
                    - id: 1be0fb53-0695-405b-ac09-deafead650af
                      name: Peeters
                      firstName: Marc
                      inszNumber: 00000009007
                      dateOfBirth: '2000-01-01'
                      postalCode: '9300'
                      address:
                        postalCode: '9300'
                        city: Aalst
                      creationDate: '2012-08-24T14:15:22+00:00'
                      registrationOrganizer:
                        id: '1234'
                        name: Example UiTPAS Organizer
                      points: 10
                      uitidStatus: UNREGISTERED
                      uitpasNumber: 0930012345615
                      cardSystemMemberships:
                      - cardSystem:
                          id: 12
                          name: UiTPAS Oostende
                          branding:
                            logo: https://www.uitpas.be/_nuxt/img/1351557.svg
                            primaryColor: rgba(0,0,0,1.0)
                            secondaryColor: rgba(97,166,14,1.0)
                          links:
                            website: https://www.uitpas.be
                          cities:
                          - postalCode: '8400'
                            name: Oostende
                          permanent: true
                        uitpasNumber: 0930012345615
                        currentCard:
                          uitpasNumber: 0930012345615
                          status: ACTIVE
                        status: ACTIVE
                        socialTariff:
                          status: ACTIVE
                          endDate: '2022-08-24T14:15:22+00:00'
                          inGracePeriod: false
                          expired: false
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/uitpas/organizer-not-found

            * https://api.publiq.be/probs/uitpas/invalid-uitpas-number

            * https://api.publiq.be/probs/uitpas/invalid-insz-number

            * https://api.publiq.be/probs/uitpas/school-not-found

            * https://api.publiq.be/probs/url/query-limit-exceeded

            * https://api.publiq.be/probs/uitpas/association-not-found


            The detail property might include more information for the client developer.

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
      operationId: get-passholders
      description: 'Retrieve passholders based on search parameters.


        Note: by default passholders in the response are alphabetically sorted by name.


        The caller of this request must have `PASSHOLDERS_SEARCH` or `PASSHOLDERS_SEARCH_BY_ID` or `PASSHOLDERS_SEARCH_ALL` permission.


        In case of `PASSHOLDERS_SEARCH` permission, passholder results are filtered based on the allowed card systems of the caller, unless searched by one of the ID fields:

        * `uitpasNumber`

        * `chipNumber`

        * `inszNumber`

        * `uitidId`


        In case of `PASSHOLDERS_SEARCH_BY_ID` permission, the caller can only make use of those ID fields.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      parameters:
      - schema:
          type: string
        in: query
        name: inszNumber
        description: Unique national (Belgian) INSZ number of an individual passholder to look up.
      - schema:
          type: string
        in: query
        name: uitpasNumber
        description: Unique UiTPAS number of an individual passholder to look up.
      - schema:
          type: string
        in: query
        name: chipNumber
        description: Hexadecimal notation of the chip number of an individual UiTPAS card.
      - schema:
          type: string
        in: query
        name: name
        description: Complete or partial last name of a passholder to look up.
      - schema:
          type: string
        in: query
        name: firstName
        description: Complete or partial first name of a passholder to look up.
      - schema:
          type: string
        in: query
        name: email
        description: Email of a passholder to look up. Wildcards * allowed.
      - schema:
          type: string
        in: query
        name: address.street
        description: Street address of a passholder to look up. Wildcards * allowed.
      - schema:
          type: string
        in: query
        name: address.city
        description: City of a passholder to look up. Wildcards * allowed.
      - schema:
          type: string
        in: query
        name: schoolId
        description: 'Organizer ID of a school, to only return passholders linked to a specific school. Use `*` to return passholders that are linked to any school. Note: Only used in very specific cases for educational integrations.'
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/limit'
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[name]
        description: Sorts the passholders by their last name in ascending or descending order. By default passholders are sorted by name, ascending order.
      - schema:
          type: string
        in: query
        name: organizerId
        description: A specific organizer ID to only return passholders that are linked to a card system related to this organizer. If omitted, the results will return passholders linked to the organizers you have permission to access.
      - schema:
          type: string
          format: date
        in: query
        name: dateOfBirthFrom
        description: Returns only passholders with a date of birth of this value (including) or more recent. Format `yyyy-mm-dd`, e.g. `2003-01-01`
      - schema:
          type: string
          format: date
        in: query
        name: dateOfBirthTo
        description: Returns only passholders with a date of birth of this value (including) or older. Format `yyyy-mm-dd`, e.g. `2003-01-01`
      - schema:
          type: string
        in: query
        name: uitidId
        description: Unique ID of the UiTiD user linked to an individual passholder to look up.
      - schema:
          type: string
        in: query
        name: associationId
        description: Filters results to passholders with a membership in the specified association. Defaults to active memberships only; use associationMembershipStatus to change this behavior. Requires association READ permission on the specified association for the provided organizerId (or for any of the caller's organizer IDs if omitted)
      - schema:
          type: string
          enum:
          - ACTIVE
          - EXPIRED
          - ALL
        in: query
        name: associationMembershipStatus
        description: Filters passholders by their association membership status. Requires associationId to be specified. Defaults to ACTIVE.
    post:
      summary: Register a new passholder
      operationId: post-passholders
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passholder'
              examples:
                Example:
                  value:
                    id: 1be0fb53-0695-405b-ac09-deafead650afx
                    name: Peeters
                    firstName: Marc
                    inszNumber: 00000009007
                    dateOfBirth: '2000-01-01'
                    postalCode: '9300'
                    address:
                      postalCode: '9300'
                      city: Aalst
                    creationDate: '2012-08-24T14:15:22+00:00'
                    registrationOrganizer:
                      id: '1234'
                      name: Example UiTPAS Organizer
                    points: 10
                    uitidStatus: UNREGISTERED
                    uitpasNumber: 0930012345615
                    cardSystemMemberships:
                    - cardSystem:
                        id: 12
                        name: UiTPAS Oostende
                        branding:
                          logo: https://www.uitpas.be/_nuxt/img/1351557.svg
                          primaryColor: rgba(0,0,0,1.0)
                          secondaryColor: rgba(97,166,14,1.0)
                        links:
                          website: https://www.uitpas.be
                        cities:
                        - postalCode: '8400'
                          name: Oostende
                        permanent: true
                      uitpasNumber: 0930012345615
                      currentCard:
                        uitpasNumber: 0930012345615
                        status: ACTIVE
                      status: ACTIVE
                      socialTariff:
                        status: ACTIVE
                        endDate: '2022-08-24T14:15:22+00:00'
                        inGracePeriod: false
                        expired: false
        '400':
          description: 'Bad request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitpas/organizer-not-found

            * https://api.publiq.be/probs/uitpas/cardsystem-not-found

            * https://api.publiq.be/probs/uitpas/invalid-city

            * https://api.publiq.be/probs/uitpas/invalid-insz-number

            * https://api.publiq.be/probs/uitpas/invalid-uitpas-number

            * https://api.publiq.be/probs/uitpas/invalid-card

            * https://api.publiq.be/probs/uitpas/invalid-card-status


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      description: 'Register a passholder


        > IMPORTANT

        >

        > * Make sure to set `registrationCardType` to either `DIGITAL` or `NFC_CARD`. In case of `NFC_CARD` the field `registrationUitpasNumber` is required and has to be a card in status `LOCAL_STOCK`.

        >

        > * `registrationOrganizer` is always required to be set to the current organizer performing the register


        The caller must have the `PASSHOLDERS_WRITE` permission for the `registrationOrganizer`. Registering a passholder with a social tariff additionally requires `PASSHOLDERS_WRITE_SOCIAL_TARIFF`, and doing so in a city other than the `registrationOrganizer` additionally requires `PASSHOLDERS_WRITE_SOCIALTARIFF_FULL_CARDSYSTEM`. These permissions are cumulative.


        `PASSHOLDERS_WRITE_FOREIGN_COUNTRY` permission is needed when registering any passholder with a country other than `be`.'
      security:
      - CLIENT_ACCESS_TOKEN: []
      - USER_ACCESS_TOKEN: []
      requestBody:
        description: Details of the new passholder to register.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passholder'
            examples:
              Example:
                value:
                  name: Peeters
                  firstName: Marc
                  inszNumber: 00000009007
                  email: marc.peeters@example.com
                  dateOfBirth: '2000-01-01'
                  registrationOrganizer:
                    id: abc12345
                  address:
                    street: Grote markt 12
                    postalCode: '9300'
                    city: Aalst
                    country: be
                  optInPreferences:
                    serviceMails: true
                    infoMails: true
                    milestoneMails: true
                    sms: false
                    post: true
                  nationality: Belg
                  legalTermsPaper: false
                  legalTermsDigital: true
                  parentalConsent: false
                  registrationCardSystemId: 1
                  registrationCardType: DIGITAL
      tags:
      - Passholders
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /passholders/{passholderId}:
    parameters:
    - $ref: '#/components/parameters/passholderId'
    get:
      summary: Retrieve passholder by ID
      operationId: get-passholders-passholderId
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Passholder'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      description: 'Retrieve a passholder by ID.


        The caller of this request must have `PASSHOLDERS_SEARCH` or `PASSHOLDERS_SEARCH_BY_ID` or `PASSHOLDERS_SEARCH_ALL` permission.'
      tags:
      - Passholders
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    delete:
      summary: Remove passholder
      operationId: delete-passholders-passholderId
      tags:
      - Passholders
      description: 'Remove this passholder.


        The caller of this request must have `PASSHOLDERS_DELETE` permission.'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    put:
      summary: Update a passholder
      operationId: put-passholders-passholderId
      responses:
        '204':
          description: Passholder updated. No Content
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
      tags:
      - Passholders
      description: 'Update a passholder.


        Only specific fields can be modified; please refer to the individual field descriptions to identify which fields are ignored during an update.


        Please note that this is a PUT endpoint, which performs a full replacement of the resource. You must include the complete resource payload in the request body, including all unchanged fields. Omitting optional fields may clear their existing values or cause validation errors.


        > The following additional rules apply:

        > * Social Tariff Permissions: Updating the `registrationSocialTariffEndDate` field requires the additional `PASSHOLDERS_WRITE_SOCIAL_TARIFF` permission.

        > * Regional Restrictions: If the passholder has a valid social tariff, the `postalCode` and `city` cannot be changed to a location outside the region of the current card system.

        > * Updating a passholder to a city outside Belgium requires the additional `PASSHOLDERS_WRITE_FOREIGN_COUNTRY` permission.

        > * `registrationOrganizer` is always required to be set to the current organizer performing the update


        The caller of this request must have `PASSHOLDERS_UPDATE` permission for the `registrationOrganizer` sent in the request body.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Passholder'
            examples:
              Example 1:
                value:
                  name: Peeters
                  firstName: Marc
                  inszNumber: 00000009007
                  email: marc.peeters@example.com
                  dateOfBirth: '2000-01-01'
                  address:
                    street: Grote markt 12
                    postalCode: '9300'
                    city: Aalst
                  optInPreferences:
                    serviceMails: true
                    infoMails: true
                    milestoneMails: true
                    sms: false
                    post: true
                  registrationOrganizer:
                    id: abc12345
                  nationality: Belg
                  legalTermsPaper: false
                  legalTermsDigital: true
                  parentalConsent: false
                  registrationSocialTariffEndDate: '2027-04-30'
        description: Updated Passholder
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /passholders/{passholderId}/private:
    parameters:
    - schema:
        type: string
      name: passholderId
      in: path
      description: Unique ID of an UiTPAS passholder.
      required: true
    get:
      summary: Retrieve private properties of a passholder
      operationId: get-passholders-passholderId-private
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateProperties'
              examples:
                Example:
                  value:
                    id: 0b46e451-8d6b-4b48-98e0-b44f76a5304c
                    note: Extra informatie van de baliemedewerker over deze pashouder.
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      description: 'Retrieve a private properties of a passholder by its ID.


        The caller of this request must have `PASSHOLDERS_PRIVATE_READ`.'
      tags:
      - Passholders
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    put:
      summary: Update private properties of a passholder
      operationId: put-passholders-passholderId-private
      responses:
        '204':
          description: Passholder private properties updated. No Content
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
      tags:
      - Passholders
      description: 'Update a passholder''s private properties.


        The caller of this request must have `PASSHOLDERS_PRIVATE_WRITE` permission.'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrivateProperties'
            examples:
              Example:
                value:
                  note: Aangepaste informatie
        description: Updated Passholder
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /passholders/{passholderId}/picture:
    parameters:
    - schema:
        type: string
      name: passholderId
      in: path
      description: Unique ID of an UiTPAS passholder.
      required: true
    get:
      summary: Get picture of passholder
      operationId: get-passholders-passholderId-picture
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PassholderPicture'
              examples:
                Example:
                  value:
                    pictureUrl: https://api-test.uitpas.be/passholders/481f8595-97cb-45c5-8a04-7fe3df860e0b/picture.png?token=b0f08488-f1f2-4709-8748-c529de66fdc5
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      description: 'Retrieve picture of the given passholder.


        This endpoint allows you to obtain a short-lived link to the picture of the passholder. After generation, this link remains active for a limited time, enabling you to include it in HTML pages displayed to your users.


        The caller of this method must have `PASSHOLDERS_PICTURE_READ` permission for the given passholder.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Passholders
    put:
      summary: Update picture of passholder
      operationId: put-passholders-passholderId-picture
      responses:
        '204':
          description: No Content
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data


            The detail property might include more information for the client developer.  '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
      description: 'Update the picture of a passholder.


        The caller of this method must have `PASSHOLDERS_PICTURE_WRITE` permission for the given passholder.'
      tags:
      - Passholders
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: The picture to upload.
              required:
              - file
            examples:
              Example:
                value:
                  file: bytes
        description: The picture of the passholder in a multipart request body.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
    delete:
      summary: Delete picture of passholder
      operationId: delete-passholders-passholderId-picture
      responses:
        '204':
          description: No Content
          content: {}
        '401':
          $ref: '#/components/responses/Unauthorized_2'
        '403':
          $ref: '#/components/responses/Forbidden_2'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error_2'
      description: 'Delete the picture of a passholder.


        The caller of this method must have `PASSHOLDERS_PICTURE_WRITE` permission for the given passholder.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Passholders
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /passholders/{passholderId}/memberships/{cardSystemId}:
    parameters:
    - schema:
        type: string
      name: passholderId
      in: path
      description: Unique ID of an UiTPAS passholder.
      required: true
    - schema:
        type: integer
      name: cardSystemId
      in: path
      required: true
      description: ID of the card system for the new membership
    post:
      summary: Create or replace card system membership of passholder
      operationId: post-passholders-passholderId-memberships-cardSystemId
      responses:
        '201':
          description: Created
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

