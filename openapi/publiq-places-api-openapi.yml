        description: The complete details of the place to update. The schema of the place is the same as the response of the [`GET /places/{placeId}`](./entry.json/paths/~1places~1{placeId}/get) operation.
      tags:
      - Places
  /places/{placeId}/address/{language}:
    parameters:
    - $ref: '#/components/parameters/placeId'
    - $ref: '#/components/parameters/language'
    put:
      summary: address - update
      operationId: place-address-put
      tags:
      - Places
      description: Updates the address of a place.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              title: place.address.put
              description: New address of the [place](./models/place.json), localized in a single language.
              properties:
                addressCountry:
                  type: string
                  minLength: 1
                  description: Country code in the ISO-3166 format. For example `BE`.
                  maxLength: 2
                  pattern: ^[A-Z][A-Z]$
                addressLocality:
                  type: string
                  minLength: 1
                  pattern: \S
                  description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                postalCode:
                  type: string
                  description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                  minLength: 1
                  pattern: \S
                streetAddress:
                  type: string
                  minLength: 1
                  pattern: \S
                  description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
              required:
              - addressCountry
              - addressLocality
              - postalCode
              - streetAddress
              examples:
              - addressCountry: BE
                addressLocality: Brussel
                postalCode: '1000'
                streetAddress: Wetstraat 1
        description: New address of the place, localized in a single language.
      responses:
        '204':
          description: The address was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
  /places/{placeId}/available-from:
    parameters:
    - $ref: '#/components/parameters/placeId'
    put:
      summary: availableFrom - update
      operationId: place-availableFrom-put
      responses:
        '204':
          description: No Content. The place availableFrom was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

