      tags:
      - Places
      responses:
        '204':
          description: No Content. The workflowStatus was successfully updated.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - error: Missing required properties (workflowStatus)
                      jsonPointer: /
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: place-workflow-status-put
      description: 'Updates the workflow status of an place. Possible statuses are:


        - `DRAFT`: The default status of new places. Places with this status do not appear in online calendars like or the search on

        - `READY_FOR_VALIDATION`: This status means the place has been published, but not approved yet. Most online calendars will already show it, and it will appear in the search on

        - `APPROVED`: The place has been approved by a moderator. It will appear on all online calendars. You cannot set this status unless you have moderation permissions.

        - `REJECTED`: The place has been rejected by a moderator. It will not appear on any online calendars. You cannot set this status unless you have moderation permissions.

        - `DELETED`: The place has been deleted. It will not appear on any online calendars.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              title: place.workflowStatus.put
              type: object
              properties:
                workflowStatus:
                  title: place.workflowStatus
                  type: string
                  description: 'The status in the moderation workflow.


                    Can be one of four types:


                    - `DRAFT`: Should not be visible on publication channels yet

                    - `READY_FOR_VALIDATION`: Submitted for validation. Some publication channels may choose to show these.

                    - `APPROVED`: Approved, will be visible on all publication channels (depending on the `availableFrom` and `availableTo`). Only possible if you have moderation permissions.

                    - `REJECTED`: Rejected, will be hidden from all publication channels. Only possible if you have moderation permissions.

                    - `DELETED`: Removed and should not be visible on any publication channels.'
                  enum:
                  - DRAFT
                  - READY_FOR_VALIDATION
                  - APPROVED
                  - REJECTED
                  - DELETED
                  examples:
                  - DRAFT
                availableFrom:
                  title: place.availableFrom
                  description: Can be set when changing the workflowStatus to `READY_FOR_VALIDATION`. The first date & time that the [place](./models/place.json) is allowed to be visible on publication channels. If omitted when changing the workflowStatus to `READY_FOR_VALIDATION`, the current datetime will be used. Must be formatted as an ISO-8601 datetime.
                  type: string
                  format: date-time
                  examples:
                  - '2021-05-17T22:00:00+00:00'
                reason:
                  type: string
                  description: Required when setting the workflowStatus to `REJECTED` (only possible with permission to moderate events). The reason why the event was rejected.
              required:
              - workflowStatus
              if:
                properties:
                  workflowStatus:
                    const: REJECTED
              then:
                required:
                - reason
              examples:
              - workflowStatus: READY_FOR_VALIDATION
                availableFrom: '2023-05-17T12:30:00+02:00'
            examples: {}
        description: New workflowStatus to set on the place. Depending on the new workflowStatus, other properties may/must be set as well.
components:
  parameters:
    language:
      name: language
      in: path
      required: true
      schema:
        type: string
        enum:
        - nl
        - fr
        - en
        - de
      description: The language of the request body properties
    labelName:
      name: labelName
      in: path
      required: true
      schema:
        type: string
        example: MyLabel
        pattern: ^(?=.{2,255}$)(?=.*\S.*\S.*)[^;]*$
      description: The label to add to an event, place or organizer. The label name should be longer than 1 character but shorter than 255 characters. The label name should not contain semicolons.
    videoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: F2D5D20C-CC98-4979-9CD2-453ABAD979B5
      description: Unique id of a video embedded in a place or event, in the format of a UUID
    organizerId:
      name: organizerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: F2D5D20C-CC98-4979-9CD2-453ABAD979B5
      description: Unique id of an organizer, in the format of a UUID
    placeId:
      name: placeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: F2D5D20C-CC98-4979-9CD2-453ABAD979B5
      description: Unique id of an place, in the format of a UUID
    imageId:
      name: imageId
      in: path
      required: true
      schema:
        type: string
        format: uuid
        example: 365f99a4-5490-4313-8ee9-adebea2dceb0
      description: The unique uuid of an already uploaded image.
    termId:
      name: termId
