openapi: 3.2.0
info:
  title: Publiq Places API
  version: '3.0'
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Places across 2 of this provider''s published API definitions: uitdatabank-entry.json, publiq-uitdatabank-entry-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://io-test.uitdatabank.be
  description: Testing
- url: https://io.uitdatabank.be
  description: Production
tags:
- name: Places
paths:
  /places:
    post:
      summary: place - create
      tags:
      - Places
      responses:
        '201':
          description: The place was created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the created place.
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                  placeId:
                    type: string
                    description: The id of the created place (deprecated and replaced with `id`).
                    deprecated: true
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                  url:
                    type: string
                    description: The url of the JSON-LD representation of the created place.
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - placeId
                - url
              examples:
                Example:
                  value:
                    id: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    placeId: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    url: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Status conflict


            To ensure data integrity and avoid duplication within the system, each place must have a unique combination of the main language title and address. You get this error when (multiple) matches already exist in the system.

            You can use the attached query to get existing place(s).

            Subsequently, appropriate actions, such as updates to an existing Place, can be done to maintain uniqueness and coherence in UDB.'
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    query: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: This place already exists. Use the attached query to get existing place(s) for the place you tried to create.
                properties:
                  query:
                    type: string
                    description: When multiple duplicated places are round, this provides a URI to existing places
                  type:
                    type: string
                    description: https://api.publiq.be/probs/uitdatabank/duplicate-place
                  title:
                    type: string
                    description: Duplicate place
                  status:
                    type: integer
                    description: '409'
                  detail:
                    type: string
                    description: Detailed description of the error
                  duplicatePlaceUri:
                    type: string
                    description: When a single duplicated place is found, this is the URI of the original place
                required:
                - type
                - title
                - status
                - detail
              examples:
                Multi duplicated places found:
                  value:
                    query: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: This place already exists. Use the attached query to get existing place(s) for the place you tried to create.
                Single duplicated place found:
                  value:
                    duplicatePlaceUri: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: A place with this address / name combination already exists. Please use the existing place for your purposes.
      operationId: place-post
      description: 'Creates a new place with the required properties and any additional optional properties.


        By default, the new place will be editable and removable by the user or client that the access token used to perform this request belongs to. If you use a user access token, the user for which the token was obtained will see the new place in their dashboard in UiTdatabank and will be able to edit or remove it. If you use a client access token, only API requests with a token for the same client will be able to edit or remove it.


        To ensure data integrity and avoid duplication within the system, each place must have a unique combination of the main language title and address.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: 'The complete details of the new place to create. The schema of the place is the same as the response of the [`GET /places/{placeId}`](./entry.json/paths/~1places~1{placeId}/get) operation.


          This request also supports an older deprecated schema that was used to create an place with just its required fields. If you have an existing integration that still uses this schema, you can view it by switching from the `place` schema to `place.post (deprecated)` below.'
        content:
          application/json:
            schema:
              $ref: ../models/place-post.json
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
  /places/{placeId}:
    parameters:
    - $ref: '#/components/parameters/placeId'
    get:
      summary: place - get
      tags:
      - Places
      responses:
        '200':
          description: Place details.
          content:
            application/json:
              schema:
                $ref: ../models/place-with-read-example.json
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: place-get
      description: Returns the details of the place for the given `placeId`.
    put:
      summary: place - update
      operationId: place-put
      responses:
        '200':
          description: The place was updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                    description: The id of the updated place.
                  placeId:
                    type: string
                    deprecated: true
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                    description: The id of the updated place (deprecated and replaced with `id`).
                  url:
                    type: string
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                    description: The url of the JSON-LD representation of the updated place.
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - placeId
                - url
              examples:
                Example:
                  value:
                    id: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    placeId: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    url: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    commandId: 92973349-967e-44d7-83a2-e1972d9e1622
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: 'Updates the place with the given `placeId` by completely overwriting it with the properties in the given JSON.


        > Any existing optional properties on the place that are not included in the update request will be removed from the place when updating the place via this operation.

        >

        > As an exception, some existing `labels` or `hiddenLabels` may be kept on the place even if they are not included in the update request. For example if they were added via the UiTdatabank UI, or if the client or user making the request does not have sufficient permission to remove some specific labels.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: ../models/place-with-write-example.json
        description: The complete details of the place to update. The schema of the place is the same as the response of the [`GET /places/{placeId}`](./entry.json/paths/~1places~1{placeId}/get) operation.
      tags:
      - Places
    delete:
      summary: place - delete
      operationId: place-delete
      responses:
        '204':
          description: No Content. The place's `workflowStatus` was successfully updated to `DELETED`.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      description: Does a soft-delete of the place. The place will continue to exist but it's `workflowStatus` will be changed to `DELETED`. This will remove it from all publication channels.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      tags:
      - Places
      x-internal: false
    servers:
    - url: https://io-test.uitdatabank.be
      description: Testing
    - url: https://io.uitdatabank.be
      description: Production
