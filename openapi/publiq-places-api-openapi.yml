  /places/{placeId}/major-info:
    parameters:
    - $ref: '#/components/parameters/placeId'
    put:
      operationId: place-major-info-put
      description: '> The major-info endpoint is deprecated and should not be used in new integrations!


        Updates the "major info" of the event with the given `placeId`.


        The major info contains:


        * `name`: The name of the place in the place''s `mainLanguage`, as a string

        * `type`: Id of the place''s `eventtype` taxonomy `term`, as a string

        * `theme` (optional): Id of the place''s `theme` taxonomy `term`, as a string

        * `address`: Object with the address of the place (see schema below)

        * `calendar`: Object with the place''s calendar information (see schema below)


        All properties are required (except for `theme`) and will overwrite existing values of these properties on the place. If the place has a `theme` `term` before this update, but there is no `theme` in this major-info update, the `theme` will be removed.


        > For backward-compatibility with older integrations, this operation can also be requested via `POST /place/{placeId}/major-info`'
      summary: major-info - update
      deprecated: true
      responses:
        '204':
          description: No Content. The major-info has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: A human-readable name in the main language of the place.
                type:
                  type: string
                  description: The `eventtype` term used to categorize the place. Terms are pre-defined and can be found using our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).
                theme:
                  type: string
                  description: The `theme` term used to categorize the place. Terms are pre-defined and can be found using our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).
                address:
                  type: object
                  title: address.localized
                  description: The address the place is located at, in the main language of the place.
                  properties:
                    addressCountry:
                      type: string
                      minLength: 1
                      description: Country code in the ISO-3166 format. For example `BE`.
                      maxLength: 2
                      pattern: ^[A-Z][A-Z]$
                    addressLocality:
                      type: string
                      minLength: 1
                      pattern: \S
                      description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                    postalCode:
                      type: string
                      description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                      minLength: 1
                      pattern: \S
                    streetAddress:
                      type: string
                      minLength: 1
                      pattern: \S
                      description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
                  required:
                  - addressCountry
                  - addressLocality
                  - postalCode
                  - streetAddress
                  examples:
                  - addressCountry: BE
                    addressLocality: Brussel
                    postalCode: '1000'
                    streetAddress: Wetstraat 1
                calendar:
                  title: place.calendar.put
                  type: object
                  description: Request body to update the calendar information of a place.
                  properties:
                    calendarType:
                      type: string
                      title: place.calendarType
                      description: 'Determines how long the [place](./models/place) exists.


                        Possible values: `periodic`, `permanent`.


                        - **periodic**: For places that only exist for a specific period. **Must** have a [startDate](./models/place-startDate.json) and [endDate](./models/place-endDate.json). Can optionally have [openingHours](./models/place-openingHours.json).


                        - **permanent**: For places that exist permanently. Can optionally have [openingHours](./models/place-openingHours.json). [Here is a detailed guide](./entry-api/shared/calendar-info#calendartype) with more information.'
                      enum:
                      - periodic
                      - permanent
                      examples:
                      - periodic
                    status:
                      title: place.status
                      description: Indicates if the [place](./models/place.json) is still open for visitations or not.
                      type: object
                      properties:
                        type:
                          enum:
                          - Available
                          - TemporarilyUnavailable
                          - Unavailable
                          example: Available
                          description: 'One of three possible status types.


                            - `Available`: Happening or open as scheduled

                            - `TemporarilyUnavailable`: Postponed or temporarily closed

                            - `Unavailable`: Cancelled or permanently closed'
                          type: string
                        reason:
                          description: The reason of the status, as a localized human-readable text.
                          type: object
                          examples:
                          - nl: Nederlandse tekst
                            fr: Texte français
                            de: Deutscher Text
                            en: English text
                          properties:
                            nl:
                              type: string
                              description: Dutch reason
                              example: Nederlandse reden
                              pattern: \S
                              minLength: 1
                            fr:
                              type: string
                              description: French reason
                              example: Raison français
                              pattern: \S
                              minLength: 1
                            de:
                              type: string
                              description: German reason
                              example: Deutscher Grund
                              pattern: \S
                              minLength: 1
                            en:
                              type: string
                              description: English reason
                              example: English reason
                              pattern: \S
                              minLength: 1
                      required:
                      - type
                      examples:
                      - type: Available
                      - type: TemporarilyUnavailable
                        reason:
                          nl: Tijdelijk gesloten wegens verbouwingswerken
                          en: Temporarily closed for renovations
                      - type: Unavailable
                        reason:
                          nl: Permanent gesloten
                    bookingAvailability:
                      title: place.bookingAvailability
                      type: object
                      description: Indicates whether the place still has tickets or reservations available. The `type` can only be `Available` for places (as opposed to events that can also have `Unavailable` when sold out), as a place can never be completely sold out forever.
                      properties:
                        type:
                          type: string
                          enum:
                          - Available
                          - Unavailable
                          description: 'One of two possible types.


                            - `Available`: Tickets or reservations available

                            - `Unavailable`: No more tickets or reservations available.'
                      required:
                      - type
                    openingHours:
                      title: place.openingHours
                      description: A list of multiple open/closed times and weekdays indicating when the [place](./models/place.json) is open.
                      type: array
                      items:
                        type: object
                        examples:
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                        properties:
                          opens:
                            type: string
                            description: Opening time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          closes:
                            type: string
                            description: Closing time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          dayOfWeek:
                            type: array
                            uniqueItems: true
                            minItems: 1
                            description: One or more weekdays that the open/closing times are applicable for.
                            items:
                              type: string
                              enum:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                              - sunday
                              description: A single weekday.
                        required:
                        - opens
                        - closes
                        - dayOfWeek
                      examples:
                      - - opens: '13:00'
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                    startDate:
                      title: place.startDate
                      description: 'The date & time that the [place](./models/place.json) starts when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                        For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    endDate:
                      title: place.endDate
                      description: 'The date & time that the [place](./models/place.json) ends when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                        For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                  required:
                  - calendarType
                  allOf:
                  - if:
                      required:
                      - calendarType
                      properties:
                        calendarType:
                          const: periodic
                    then:
                      required:
                      - startDate
                      - endDate
              required:
              - name
              - type
              - address
              - calendar
            examples:
              Permanent with opening hours:
                value:
                  name: Sint-Pieterskerk
                  type: 0.14.0.0.0
                  theme: 1.44.0.0.0
                  address:
                    streetAddress: Grote Markt 1
                    postalCode: '3000'
                    addressLocality: Leuven
                    addressCountry: BE
                  calendar:
                    calendarType: permanent
                    openingHours:
                    - opens: '10:00'
                      closes: '16:30'
                      dayOfWeek:
                      - monday
                      - tuesday
                      - thursday
                      - friday
                      - saturday
                    - opens: '11:00'
                      closes: '16:30'
                      dayOfWeek:
                      - sunday
              Periodic with opening hours:
                value:
                  name: Velodroom
                  type: Yf4aZBfsUEu2NsQqsprngw
                  address:
                    streetAddress: Brusselsestraat
                    postalCode: '3000'
                    addressLocality: Leuven
                    addressCountry: BE
