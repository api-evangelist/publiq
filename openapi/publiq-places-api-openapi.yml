  /places/{placeId}/calendar:
    parameters:
    - $ref: '#/components/parameters/placeId'
    put:
      summary: calendar - update
      tags:
      - Places
      responses:
        '204':
          description: No Content. The calendar information has been updated successfully.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (calendarType) are missing
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
      operationId: place-calendar-put
      requestBody:
        content:
          application/json:
            schema:
              title: place.calendar.put
              type: object
              description: Request body to update the calendar information of a place.
              properties:
                calendarType:
                  type: string
                  title: place.calendarType
                  description: 'Determines how long the [place](./models/place) exists.


                    Possible values: `periodic`, `permanent`.


                    - **periodic**: For places that only exist for a specific period. **Must** have a [startDate](./models/place-startDate.json) and [endDate](./models/place-endDate.json). Can optionally have [openingHours](./models/place-openingHours.json).


                    - **permanent**: For places that exist permanently. Can optionally have [openingHours](./models/place-openingHours.json). [Here is a detailed guide](./entry-api/shared/calendar-info#calendartype) with more information.'
                  enum:
                  - periodic
                  - permanent
                  examples:
                  - periodic
                status:
                  title: place.status
                  description: Indicates if the [place](./models/place.json) is still open for visitations or not.
                  type: object
                  properties:
                    type:
                      enum:
                      - Available
                      - TemporarilyUnavailable
                      - Unavailable
                      example: Available
                      description: 'One of three possible status types.


                        - `Available`: Happening or open as scheduled

                        - `TemporarilyUnavailable`: Postponed or temporarily closed

                        - `Unavailable`: Cancelled or permanently closed'
                      type: string
                    reason:
                      description: The reason of the status, as a localized human-readable text.
                      type: object
                      examples:
                      - nl: Nederlandse tekst
                        fr: Texte français
                        de: Deutscher Text
                        en: English text
                      properties:
                        nl:
                          type: string
                          description: Dutch reason
                          example: Nederlandse reden
                          pattern: \S
                          minLength: 1
                        fr:
                          type: string
                          description: French reason
                          example: Raison français
                          pattern: \S
                          minLength: 1
                        de:
                          type: string
                          description: German reason
                          example: Deutscher Grund
                          pattern: \S
                          minLength: 1
                        en:
                          type: string
                          description: English reason
                          example: English reason
                          pattern: \S
                          minLength: 1
                  required:
                  - type
                  examples:
                  - type: Available
                  - type: TemporarilyUnavailable
                    reason:
                      nl: Tijdelijk gesloten wegens verbouwingswerken
                      en: Temporarily closed for renovations
                  - type: Unavailable
                    reason:
                      nl: Permanent gesloten
                bookingAvailability:
                  title: place.bookingAvailability
                  type: object
                  description: Indicates whether the place still has tickets or reservations available. The `type` can only be `Available` for places (as opposed to events that can also have `Unavailable` when sold out), as a place can never be completely sold out forever.
                  properties:
                    type:
                      type: string
                      enum:
                      - Available
                      - Unavailable
                      description: 'One of two possible types.


                        - `Available`: Tickets or reservations available

                        - `Unavailable`: No more tickets or reservations available.'
                  required:
                  - type
                openingHours:
                  title: place.openingHours
                  description: A list of multiple open/closed times and weekdays indicating when the [place](./models/place.json) is open.
                  type: array
                  items:
                    type: object
                    examples:
                    - opens: 09:00
                      closes: '17:00'
                      dayOfWeek:
                      - monday
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                    properties:
                      opens:
                        type: string
                        description: Opening time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                        examples:
                        - '17:00'
                        pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                      closes:
                        type: string
                        description: Closing time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                        examples:
                        - '17:00'
                        pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                      dayOfWeek:
                        type: array
                        uniqueItems: true
                        minItems: 1
                        description: One or more weekdays that the open/closing times are applicable for.
                        items:
                          type: string
                          enum:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                          description: A single weekday.
                    required:
                    - opens
                    - closes
                    - dayOfWeek
                  examples:
                  - - opens: '13:00'
                      closes: '17:00'
                      dayOfWeek:
                      - monday
                    - opens: 09:00
                      closes: '17:00'
                      dayOfWeek:
                      - tuesday
                      - wednesday
                      - thursday
                      - friday
                      - saturday
                      - sunday
                startDate:
                  title: place.startDate
                  description: 'The date & time that the [place](./models/place.json) starts when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                    For example `2021-05-17T22:00:00+00:00`.'
                  type: string
                  format: date-time
                  examples:
                  - '2021-05-17T22:00:00+00:00'
                endDate:
                  title: place.endDate
                  description: 'The date & time that the [place](./models/place.json) ends when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                    For example `2021-05-17T22:00:00+00:00`.'
                  type: string
                  format: date-time
                  examples:
                  - '2021-05-17T22:00:00+00:00'
              required:
              - calendarType
              allOf:
              - if:
                  required:
                  - calendarType
                  properties:
                    calendarType:
                      const: periodic
                then:
                  required:
                  - startDate
                  - endDate
            examples:
              periodic:
                value:
                  calendarType: periodic
                  startDate: '2021-05-17T22:00:00+00:00'
                  endDate: '2021-05-17T22:00:00+00:00'
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
              permanent:
                value:
                  calendarType: permanent
                  openingHours:
                  - opens: '13:00'
                    closes: '17:00'
                    dayOfWeek:
                    - monday
                  - opens: 09:00
                    closes: '17:00'
                    dayOfWeek:
                    - tuesday
                    - wednesday
                    - thursday
                    - friday
                    - saturday
                    - sunday
                  status:
                    type: Available
                  bookingAvailability:
                    type: Available
        description: New calendar information.
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      description: 'Updates the calendar information of the given `placeId`. The calendar information will be completely replaced with the new one.


        The required properties depend on the `calendarType` property.


        | calendarType | required | optional |

        |---|---|---|

        | periodic | startDate, endDate | openingHours, status, bookingAvailability |

        | permanent | | openingHours, status, bookingAvailability |


        > If the event has a `status` or `bookingAvailability` that is not `Available`, and you do not include this `status` or `bookingAvailability` in the new calendar information, they will get reverted back to the default `Available`!


        > Contrary to events, places cannot use calendarType `single` or `multiple`!'
  /places/{placeId}/calendar-summary:
