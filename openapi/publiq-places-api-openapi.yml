        > This operation is deprecated and should not be used in new integrations. Use the `POST /places` operation instead to create new places.

        >

        > Both operations accept the same JSON bodies nowadays, and support creating places with only the required properties or with additional optional properties.

        >

        > The only difference is that the default `workflowStatus` for places created via `POST /places` is `DRAFT`, while new places created via this `POST /imports/places` operation will have the default workflowStatus `READY_FOR_VALIDATION` for backward compatibility with historical integrations.

        >

        > If you want your new places to also have the workflowStatus `READY_FOR_VALIDATION`, you can use the `POST /places` operation and explicitly set the `workflowStatus` property in your JSON body to `READY_FOR_VALIDATION`.'
