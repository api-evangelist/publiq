openapi: 3.2.0
info:
  title: Entry Places API
  version: '3.0'
  description: With UiTdatabank's Entry API you can create new events, places and organizers, and add extra info to them with specific requests to add/update properties. For example there are operations to add a label, remove a label, add an image, and so on.
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-source: https://raw.githubusercontent.com/cultuurnet/apidocs/main/../../../private/tmp/publiq-src/apidocs-main/projects/uitdatabank/reference/entry.json
servers:
- url: https://io-test.uitdatabank.be
  description: Testing
- url: https://io.uitdatabank.be
  description: Production
tags:
- name: Places
paths:
  /places:
    post:
      summary: place - create
      tags:
      - Places
      responses:
        '201':
          description: The place was created successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: The id of the created place.
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                  placeId:
                    type: string
                    description: The id of the created place (deprecated and replaced with `id`).
                    deprecated: true
                    example: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uuid
                  url:
                    type: string
                    description: The url of the JSON-LD representation of the created place.
                    example: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    format: uri
                  commandId:
                    type: string
                    example: 92973349-967e-44d7-83a2-e1972d9e1622
                    format: uuid
                    deprecated: true
                    description: ID of the last internal command that was dispatched for this operation. Will be removed in the future.
                required:
                - id
                - placeId
                - url
              examples:
                Example:
                  value:
                    id: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    placeId: c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
                    url: https://io-test.uitdatabank.be/places/c8e6ff82-8b30-4295-b937-ab2f4f6ab4bf
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Invalid data:
                  value:
                    type: https://api.publiq.be/probs/body/invalid-data
                    title: Invalid body data
                    status: 400
                    schemaErrors:
                    - jsonPointer: /
                      error: The required properties (name) are missing.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Status conflict


            To ensure data integrity and avoid duplication within the system, each place must have a unique combination of the main language title and address. You get this error when (multiple) matches already exist in the system.

            You can use the attached query to get existing place(s).

            Subsequently, appropriate actions, such as updates to an existing Place, can be done to maintain uniqueness and coherence in UDB.'
          content:
            application/json:
              schema:
                type: object
                x-examples:
                  Example 1:
                    query: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: This place already exists. Use the attached query to get existing place(s) for the place you tried to create.
                properties:
                  query:
                    type: string
                    description: When multiple duplicated places are round, this provides a URI to existing places
                  type:
                    type: string
                    description: https://api.publiq.be/probs/uitdatabank/duplicate-place
                  title:
                    type: string
                    description: Duplicate place
                  status:
                    type: integer
                    description: '409'
                  detail:
                    type: string
                    description: Detailed description of the error
                  duplicatePlaceUri:
                    type: string
                    description: When a single duplicated place is found, this is the URI of the original place
                required:
                - type
                - title
                - status
                - detail
              examples:
                Multi duplicated places found:
                  value:
                    query: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: This place already exists. Use the attached query to get existing place(s) for the place you tried to create.
                Single duplicated place found:
                  value:
                    duplicatePlaceUri: /place/581314d4-637e-407b-ba35-8b60847012d0
                    type: https://api.publiq.be/probs/uitdatabank/duplicate-place
                    title: Duplicate place
                    status: 409
                    detail: A place with this address / name combination already exists. Please use the existing place for your purposes.
      operationId: place-post
      description: 'Creates a new place with the required properties and any additional optional properties.


        By default, the new place will be editable and removable by the user or client that the access token used to perform this request belongs to. If you use a user access token, the user for which the token was obtained will see the new place in their dashboard in UiTdatabank and will be able to edit or remove it. If you use a client access token, only API requests with a token for the same client will be able to edit or remove it.


        To ensure data integrity and avoid duplication within the system, each place must have a unique combination of the main language title and address.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: 'The complete details of the new place to create. The schema of the place is the same as the response of the [`GET /places/{placeId}`](./entry.json/paths/~1places~1{placeId}/get) operation.


          This request also supports an older deprecated schema that was used to create an place with just its required fields. If you have an existing integration that still uses this schema, you can view it by switching from the `place` schema to `place.post (deprecated)` below.'
        content:
          application/json:
            schema:
              anyOf:
              - title: place
                type: object
                description: 'A cultural, pastime, or sports-related location that can be visited or where an event can be located at.


                  For more information: <a href="https://docs.publiq.be/docs/uitdatabank/entry-api/places/what-are-places">What are places?</a>'
                allOf:
                - properties:
                    '@id':
                      title: place.@id
                      type: string
                      format: uri
                      pattern: ^http[s]?:\/\/.+?\/place[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                      description: A unique URI that acts as globally unique ID for the [place](./models/place.json). Based on (JSON-LD node identifiers)[https://www.w3.org/TR/json-ld/#node-identifiers].
                      examples:
                      - https://io-test.uitdatabank.be/places/85b04295-479c-40f5-b3dd-469dfb4387b3
                    mainLanguage:
                      title: place.mainLanguage
                      description: 'The main language that the [place](./models/place.json) is described in. All localized properties like [name](./models/place-name.json) and [description](./models/place-description.json) will be required to have at least a value for this language.


                        Can be one of `nl`, `fr`, `de`, or `en`.'
                      type: string
                      enum:
                      - nl
                      - fr
                      - de
                      - en
                    name:
                      type: object
                      title: place.name
                      description: 'The human-readable, localized name of the [place](./models/place.json).


                        Requires at least one value, for the language specified in the [mainLanguage](./models/place-mainLanguage.json) property.'
                      minProperties: 1
                      properties:
                        nl:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `nl` (Dutch) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        fr:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `fr` (French) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        de:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `de` (German) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                        en:
                          type: string
                          title: name.localized
                          description: A human-readable name in the `en` (English) language.
                          minLength: 1
                          maxLength: 90
                          pattern: \S
                          examples:
                          - Example name
                      examples:
                      - nl: Voorbeeld van een naam
                        fr: Exemple d'un nom
                        de: Beispiel eines Namens
                        en: Example of a name
                      minLength: 1
                      maxLength: 90
                    terms:
                      type: array
                      title: place.terms
                      description: 'A list of taxonomy terms used to categorize the [place](./models/place.json).


                        Terms are pre-defined and can be found using our [guide about taxonomy terms](../docs/taxonomy-api/terms.md).


                        A place requires at least one term, to define its type. (For example a museum, monument, ...)'
                      uniqueItems: true
                      minItems: 1
                      contains:
                        properties:
                          domain:
                            const: eventtype
                      minContains: 1
                      maxContains: 1
                      examples:
                      - - id: 0.14.0.0.0
                          label: Monument
                          domain: eventtype
                      items:
                        title: ''
                        type: object
                        description: 'A taxonomy term used to categorize places.


                          All places require exactly one term of the `eventtype` domain, and can optionally contain other terms.


                          When reading places, all properties will be available. When creating or updating places only the `id` is required to be included.'
                        examples:
                        - id: 0.14.0.0.0
                          label: Concert
                          domain: eventtype
                        properties:
                          id:
                            type: string
                            description: Unique id of the term. For example `0.14.0.0.0`.
                            example: 0.14.0.0.0
                          label:
                            type: string
                            description: Human-readable label of the term. Currently only available in Dutch. For example `Concert`.
                            example: Monument
                          domain:
                            type: string
                            example: eventtype
                            description: The domain of the term. Can be one of `eventtype` or `facility`.
                            enum:
                            - facility
                            - eventtype
                        required:
                        - id
                    calendarType:
                      type: string
                      title: place.calendarType
                      description: 'Determines how long the [place](./models/place) exists.


                        Possible values: `periodic`, `permanent`.


                        - **periodic**: For places that only exist for a specific period. **Must** have a [startDate](./models/place-startDate.json) and [endDate](./models/place-endDate.json). Can optionally have [openingHours](./models/place-openingHours.json).


                        - **permanent**: For places that exist permanently. Can optionally have [openingHours](./models/place-openingHours.json). [Here is a detailed guide](./entry-api/shared/calendar-info#calendartype) with more information.'
                      enum:
                      - periodic
                      - permanent
                      examples:
                      - periodic
                    address:
                      type: object
                      title: place.address
                      description: 'The address the [place](./models/place.json) is located at. Localized because some parts like the municipality or street address can be different in Dutch, French, German and/or English.


                        Requires at least one locale, specifically the one defined in the [mainLanguage](./models/place-mainLanguage.json) of the place.


                        **Only add a localized version if it''s an official variant!**'
                      minProperties: 1
                      properties:
                        nl:
                          type: object
                          title: address.localized
                          description: An address in the `nl` (Dutch) language.
                          properties:
                            addressCountry:
                              type: string
                              minLength: 1
                              description: Country code in the ISO-3166 format. For example `BE`.
                              maxLength: 2
                              pattern: ^[A-Z][A-Z]$
                            addressLocality:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                            postalCode:
                              type: string
                              description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                              minLength: 1
                              pattern: \S
                            streetAddress:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
                          required:
                          - addressCountry
                          - addressLocality
                          - postalCode
                          - streetAddress
                          examples:
                          - addressCountry: BE
                            addressLocality: Brussel
                            postalCode: '1000'
                            streetAddress: Wetstraat 1
                        fr:
                          type: object
                          title: address.localized
                          description: An address in the `fr` (French) language.
                          properties:
                            addressCountry:
                              type: string
                              minLength: 1
                              description: Country code in the ISO-3166 format. For example `BE`.
                              maxLength: 2
                              pattern: ^[A-Z][A-Z]$
                            addressLocality:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                            postalCode:
                              type: string
                              description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                              minLength: 1
                              pattern: \S
                            streetAddress:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
                          required:
                          - addressCountry
                          - addressLocality
                          - postalCode
                          - streetAddress
                          examples:
                          - addressCountry: BE
                            addressLocality: Brussel
                            postalCode: '1000'
                            streetAddress: Wetstraat 1
                        de:
                          type: object
                          title: address.localized
                          description: An address in the `de` (German) language.
                          properties:
                            addressCountry:
                              type: string
                              minLength: 1
                              description: Country code in the ISO-3166 format. For example `BE`.
                              maxLength: 2
                              pattern: ^[A-Z][A-Z]$
                            addressLocality:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                            postalCode:
                              type: string
                              description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                              minLength: 1
                              pattern: \S
                            streetAddress:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
                          required:
                          - addressCountry
                          - addressLocality
                          - postalCode
                          - streetAddress
                          examples:
                          - addressCountry: BE
                            addressLocality: Brussel
                            postalCode: '1000'
                            streetAddress: Wetstraat 1
                        en:
                          type: object
                          title: address.localized
                          description: An address in the `en` (English) language.
                          properties:
                            addressCountry:
                              type: string
                              minLength: 1
                              description: Country code in the ISO-3166 format. For example `BE`.
                              maxLength: 2
                              pattern: ^[A-Z][A-Z]$
                            addressLocality:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Municipality of the address in the relevant locale, for example `Brussel` for `nl` or `Bruxelles` for `fr`.
                            postalCode:
                              type: string
                              description: Postal code of the municipality, for example `1000`. Formatted as a string because some international postal codes use letters.
                              minLength: 1
                              pattern: \S
                            streetAddress:
                              type: string
                              minLength: 1
                              pattern: \S
                              description: Street address in the relevant locale, for example `Wetstraat 1` for `nl` or `Rue de la Loi 1` for `fr`.
                          required:
                          - addressCountry
                          - addressLocality
                          - postalCode
                          - streetAddress
                          examples:
                          - addressCountry: BE
                            addressLocality: Brussel
                            postalCode: '1000'
                            streetAddress: Wetstraat 1
                      examples:
                      - nl:
                          addressCountry: BE
                          addressLocality: Brussel
                          postalCode: '1000'
                          streetAddress: Wetstraat 1
                        fr:
                          addressCountry: BE
                          addressLocality: Bruxelles
                          postalCode: '1000'
                          streetAddress: Rue de la Loi 1
                    geo:
                      title: place.geo
                      description: Geographic coordinates corresponding to the [address](./models/place-address.json) the place is located at. Calculated automatically by UiTdatabank.
                      type: object
                      properties:
                        latitude:
                          type: number
                          format: float
                          minimum: -90
                          maximum: 90
                          description: A geographic coordinate that specifies the north–south position of a point on the Earth's surface from the equator to one of the poles.
                        longitude:
                          type: number
                          format: float
                          minimum: -180
                          maximum: 180
                          description: A geographic coordinate that specifies the east–west position of a point on the Earth's surface from Greenwich, England.
                      required:
                      - latitude
                      - longitude
                      readOnly: true
                      examples:
                      - latitude: 50.8816177
                        longitude: 4.7137986
                    organizer:
                      type: object
                      title: place.organizer
                      description: A reference to an [organizer](./models/organizer.json) linked to the place. When writing a place it should only contain an `@id` property. When reading a place it will contain all the properties from the [organizer](./models/organizer.json).
                      examples:
                      - '@id': https://io-test.uitdatabank.be/organizers/5cf42d51-3a4f-46f0-a8af-1cf672be8c84
                      properties:
                        '@id':
                          title: organizer.@id
                          type: string
                          format: uri
                          description: A unique URI that acts as globally unique ID for the [organizer](./models/organizer.json). Based on [JSON-LD node identifiers](https://www.w3.org/TR/json-ld/#node-identifiers).
                          examples:
                          - https://io-test.uitdatabank.be/organizers/5cf42d51-3a4f-46f0-a8af-1cf672be8c84
                          pattern: ^http[s]?:\/\/.+?\/organizer[s]?\/([0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-?[0-9A-Fa-f]{12})[\/]?
                      required:
                      - '@id'
                    startDate:
                      title: place.startDate
                      description: 'The date & time that the [place](./models/place.json) starts when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                        For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    endDate:
                      title: place.endDate
                      description: 'The date & time that the [place](./models/place.json) ends when using the `periodic` [calendarType](./models/place-calendarType.json), as an ISO-8601 date.


                        For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    status:
                      title: place.status
                      description: Indicates if the [place](./models/place.json) is still open for visitations or not.
                      type: object
                      properties:
                        type:
                          enum:
                          - Available
                          - TemporarilyUnavailable
                          - Unavailable
                          example: Available
                          description: 'One of three possible status types.


                            - `Available`: Happening or open as scheduled

                            - `TemporarilyUnavailable`: Postponed or temporarily closed

                            - `Unavailable`: Cancelled or permanently closed'
                          type: string
                        reason:
                          description: The reason of the status, as a localized human-readable text.
                          type: object
                          examples:
                          - nl: Nederlandse tekst
                            fr: Texte français
                            de: Deutscher Text
                            en: English text
                          properties:
                            nl:
                              type: string
                              description: Dutch reason
                              example: Nederlandse reden
                              pattern: \S
                              minLength: 1
                            fr:
                              type: string
                              description: French reason
                              example: Raison français
                              pattern: \S
                              minLength: 1
                            de:
                              type: string
                              description: German reason
                              example: Deutscher Grund
                              pattern: \S
                              minLength: 1
                            en:
                              type: string
                              description: English reason
                              example: English reason
                              pattern: \S
                              minLength: 1
                      required:
                      - type
                      examples:
                      - type: Available
                      - type: TemporarilyUnavailable
                        reason:
                          nl: Tijdelijk gesloten wegens verbouwingswerken
                          en: Temporarily closed for renovations
                      - type: Unavailable
                        reason:
                          nl: Permanent gesloten
                    openingHours:
                      title: place.openingHours
                      description: A list of multiple open/closed times and weekdays indicating when the [place](./models/place.json) is open.
                      type: array
                      items:
                        type: object
                        examples:
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                        properties:
                          opens:
                            type: string
                            description: Opening time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          closes:
                            type: string
                            description: Closing time on the related weekdays, in H:MM or HH:MM format (24-hour notation).
                            examples:
                            - '17:00'
                            pattern: ^([01]?\d|2[0-3]):[0-5]\d$
                          dayOfWeek:
                            type: array
                            uniqueItems: true
                            minItems: 1
                            description: One or more weekdays that the open/closing times are applicable for.
                            items:
                              type: string
                              enum:
                              - monday
                              - tuesday
                              - wednesday
                              - thursday
                              - friday
                              - saturday
                              - sunday
                              description: A single weekday.
                        required:
                        - opens
                        - closes
                        - dayOfWeek
                      examples:
                      - - opens: '13:00'
                          closes: '17:00'
                          dayOfWeek:
                          - monday
                        - opens: 09:00
                          closes: '17:00'
                          dayOfWeek:
                          - tuesday
                          - wednesday
                          - thursday
                          - friday
                          - saturday
                          - sunday
                    availableFrom:
                      title: place.availableFrom
                      description: 'The first date & time that the [place](./models/place.json) is allowed to be visible on publication channels.


                        Formatted as an ISO-8601 datetime. For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    availableTo:
                      title: place.availableTo
                      description: 'The last date & time that the [place](./models/place.json) is allowed to be visible on publication channels.


                        Added automatically by UiTdatabank based on either the [startDate](./models/place-startDate) or [endDate](./models/place-endDate.json) depending on the [event type](./models/place-terms.json).


                        Formatted as an ISO-8601 datetime. For example `2021-05-17T22:00:00+00:00`.'
                      type: string
                      format: date-time
                      readOnly: true
                      examples:
                      - '2021-05-17T22:00:00+00:00'
                    workflowStatus:
                      title: place.workflowStatus
                      type: string
                      description: 'The status in the moderation workflow.


                        Can be one of four types:


                        - `DRAFT`: Should not be visible on publication channels yet

                        - `READY_FOR_VALIDATION`: Submitted for validation. Some publication channels may choose to show these.

                        - `APPROVED`: Approved, will be visible on all publication channels (depending on the `availableFrom` and `availableTo`). Only possible if you have moderation permissions.

                        - `REJECTED`: Rejected, will be hidden from all publication channels. Only possible if you have moderation permissions.

                        - `DELETED`: Removed and should not be visible on any publication channels.'
                      enum:
                      - DRAFT
                      - READY_FOR_VALIDATION
                      - APPROVED
                      - REJECTED
                      - DELETED
                      examples:
                      - DRAFT
                    languages:
                      type: array
                      title: place.languages
                      description: 'List of languages that the [place](./models/place.json) is available in. (Not all localizable properties may contain every language though)


                        Added automatically by UiTdatabank based on the languages present in localized properties.


                        See also [completedLanguages](./models/place-completedLanguages.json).'
                      readOnly: true
                      minItems: 1
                      items:
                        type: string
                        enum:
                        - nl
                        - fr
                        - de
                        - en
                        example: nl
                      examples:
