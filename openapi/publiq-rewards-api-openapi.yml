openapi: 3.2.0
info:
  title: Publiq Rewards API
  version: '4.0'
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Rewards across 2 of this provider''s published API definitions: uitpas-uitpas.json, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Rewards
paths:
  /rewards:
    get:
      x-internal: false
      summary: Search rewards
      operationId: get-rewards
      responses:
        '200':
          description: Paginated collection of rewards.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RewardsPaginatedResponse'
              examples:
                Example:
                  value:
                    totalItems: 1
                    member:
                    - id: '1234'
                      title: Free entrance for 10 points on 1 specific event
                      type: POINTS
                      owningCardSystem:
                        id: 1
                        name: UiTPAS Dender
                      categories:
                      - Doen
                      allCardSystems: true
                      status: ACTIVE
                      maxAvailableUnits: 0
                      unitsTaken: 0
                      promotionalDescription: this is the mandatory description
                      practicalInfo: this is an optional extra description
                      pictures:
                      - https://www.uitpas.be/default-picture-for-ticketsale-rewards.png
                      publicationPeriod:
                        begin: '2021-08-24T14:15:22+00:00'
                        end: '2022-08-24T14:15:22+00:00'
                      redeemPeriod:
                        begin: '2021-08-24T14:15:22+00:00'
                        end: '2022-08-24T14:15:22+00:00'
                      grantingPeriod:
                        begin: '2021-08-24T14:15:22+00:00'
                        end: '2022-08-24T14:15:22+00:00'
                      moreInfoURL: https://www.uitpas.be/reward/example-more-info
                      inSpotlight: false
                      points: 10
                      forKids: false
                      sport: false
                      online: false
                      featured: true
                    facet:
                      categories:
                        Doen:
                          name:
                            nl: Doen
                          count: 402
                        Gadget:
                          name:
                            nl: Gadget
                          count: 101
                      owningCardSystemId:
                        '1':
                          name:
                            nl: UiTPAS Dender
                          count: 124
                        '8':
                          name:
                            nl: UiTPAS Gent
                          count: 503
                      sport:
                        'true':
                          name:
                            nl: Sportactiviteiten
                          count: 45
                        'false':
                          name:
                            nl: Geen sportactiviteiten
                          count: 458
                      forKids:
                        'true':
                          name:
                            nl: Speciaal voor kinderen
                          count: 24
                        'false':
                          name:
                            nl: Niet speciaal voor kinderen
                          count: 479
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/uitpas/organizer-not-found

            * https://api.publiq.be/probs/uitpas/event-not-found

            * https://api.publiq.be/probs/uitpas/cardsystem-not-found

            * https://api.publiq.be/probs/url/query-limit-exceeded'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found. Error type:


            https://api.publiq.be/probs/url/not-found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      tags:
      - Rewards
      description: 'Search rewards.


        The caller of this request does not need special permissions permission except `REWARDS_PASSHOLDERS_READ` to use the `isRedeemableByPassholderId` and `isInterestingForPassholderId` query parameters.


        This endpoint allows authentication with client identification, client access tokens, and user access tokens.'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      - CLIENT_IDENTIFICATION: []
      parameters:
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/limit'
      - schema:
          type: array
          items:
            type: string
        in: query
        name: organizerId
        description: Include only rewards applicable for this organizer. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: array
          items:
            type: string
        in: query
        name: organizerPostalCode
        description: Include only rewards applicable for organizers with this postal code. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: array
          items:
            type: string
        in: query
        name: owningCardSystemId
        description: Include only rewards of this card system. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: array
          items:
            type: string
        in: query
        name: applicableCardSystemId
        description: Include only rewards applicable to passholders of this card system. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: string
          enum:
          - POINTS
          - WELCOME
          - ANY
          default: POINTS
        in: query
        name: type
        description: Include only rewards of this type. By default, this is set to `POINTS`. Use `ANY` to include rewards of any type.
        style: form
      - schema:
          type: string
        in: query
        name: text
        description: Free text search in reward name, organizer or city.
        style: form
      - schema:
          type: array
          items:
            type: string
            enum:
            - categories
            - forKids
            - sport
            - online
            - lastChance
            - owningCardSystemId
            - type
        in: query
        name: facets
        description: Request facets of the given field in the response. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: string
          example: -redeemCount,points
        in: query
        name: sort
        description: 'Sorts the rewards in a specific order. Possible values are: `name`, `creationdate`, `redeemCount`, `featured`, `points`. Multiple values can be combined in a comma separated string so the rewards are first sorted by the first field, then the second and so on. By default the sort uses ascending order. Descending order can be specified by including a `-` sign before the field that needs to be ordered descending. e.g. use `-redeemCount,points` to sort descending on redeemCount, and next ascending on `points`.'
        style: form
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[name]
        description: Sorts the rewards by their name in ascending or descending order. This parameter is deprecated. Use the `sort` parameter for more advanced sorting options.
        style: form
        deprecated: true
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[creationDate]
        description: Sort on reward creation date. This parameter is deprecated. Use the `sort` parameter for more advanced sorting options.
        style: form
        deprecated: true
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[redeemCount]
        description: Sort on redeem count. This parameter is deprecated. Use the `sort` parameter for more advanced sorting options.
        style: form
        deprecated: true
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[featured]
        description: Sort on featured. This parameter is deprecated. Use the `sort` parameter for more advanced sorting options.
        style: form
        deprecated: true
      - schema:
          type: string
          enum:
          - asc
          - desc
        in: query
        name: sort[points]
        description: Sort on reward points. This parameter is deprecated. Use the `sort` parameter for more advanced sorting options.
        style: form
        deprecated: true
      - schema:
          type: array
          items:
            type: string
            enum:
            - Goede doel
            - Eten en drinken
            - Doen
            - Gadget of item
        in: query
        name: categories
        description: Include only rewards of this category. Can be included more than once to allow multiple values.
        style: form
        explode: true
      - schema:
          type: integer
        in: query
        name: pointsFrom
        description: Include only rewards with this value (including) or more points.
        style: form
      - schema:
          type: integer
        in: query
        name: pointsTo
        description: Include only rewards with this value (including) or less points.
        style: form
      - schema:
          type: string
          default: ENDUSERS
          enum:
          - ALL
          - ENDUSERS
          - REDEEMABLE
          - REDEEMABLE-FUTURE
          - ENDUSER-FUTURE
        in: query
        name: subset
        description: Include only rewards of a specific subset. Defaults to `ENDUSERS`, which means all active rewards, that are currently published and in its redeem period and are part of a permanent cardsystem. `REDEEMABLE` is the same as `ENDUSER` except filtering on publication date. `ENDUSER-FUTURE` and `REDEEMABLE-FUTURE` is similar to their respective subset, but filters on a redeem date in the future. Set this field to `ALL` to include all rewards.
        style: form
      - schema:
          type: boolean
        in: query
        name: sport
        description: Include only rewards with the sport property true or false. If omitted, rewards with any sport value are included.
      - schema:
          type: boolean
        in: query
        name: forKids
        description: Include only rewards with the forKids property true or false. If omitted, rewards with any forKids value are included.
      - schema:
          type: boolean
        in: query
        name: featured
        description: Include only rewards with the featured property true or false. If omitted, rewards with any featured value are included.
      - schema:
          type: boolean
        in: query
        name: online
        description: Include only rewards with the online property true or false. If omitted, rewards with any online value are included.
      - schema:
          type: boolean
        in: query
        name: lastChance
        description: Include only rewards with the lastChance property true or false. If omitted, rewards with any lastChance value are included.
      - schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
          - DELETED
        in: query
        name: status
        description: Include only rewards with this status. Also set `subset=ALL` to include non-ACTIVE rewards.
      - schema:
          type: string
        in: query
        name: isRedeemableByPassholderId
        description: Include only rewards that are redeemable by this passholder ID. This means the reward itself is within its redeem period, and all redeem constraints for the passholder are met. A client using this parameter needs `REWARDS_PASSHOLDERS_READ` permission.
      - schema:
          type: string
        in: query
        name: isInterestingForPassholderId
        description: Include a list of suggested rewards based on the recent activity of this passholder ID. A client using this parameter needs `REWARDS_PASSHOLDERS_READ` permission.
    post:
      x-internal: false
      summary: Create new reward
      operationId: post-rewards
      responses:
        '200':
          description: Reward created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
              examples:
                Points reward:
                  value:
                    id: '1234'
                    type: POINTS
                    title: Gratis koffie
                    owningCardSystem:
                      id: 1
                      name: UiTPAS Dender
                    allCardSystems: true
                    status: ACTIVE
                    maxAvailableUnits: 100
                    unitsTaken: 0
                    promotionalDescription: this is the mandatory description
                    pictures:
                    - https://www.uitpas.be/default-picture-for-points-rewards.png
                    publicationPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    redeemPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    moreInfoURL: https://example.org/more-info-about-this-reward
                    inSpotlight: false
                    points: 3
                    categories:
                    - Eten en drinken
                    forKids: false
                    sport: false
                    online: true
                Welcome reward:
                  value:
                    id: '1234'
                    type: WELCOME
                    title: Gratis zwemmen
                    owningCardSystem:
                      id: 1
                      name: UiTPAS Dender
                    allCardSystems: true
                    status: ACTIVE
                    maxAvailableUnits: 100
                    unitsTaken: 0
                    promotionalDescription: this is the mandatory description
                    pictures:
                    - https://www.uitpas.be/default-picture-for-welcome-rewards.png
                    publicationPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    redeemPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    grantingPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    inSpotlight: false
                    forKids: false
                    sport: false
                    online: false
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitpas/invalid-card-system


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      description: 'Create a new reward.


        The caller of this request must have `REWARDS_WRITE` permission for the given organizer.'
      tags:
      - Rewards
      requestBody:
        description: Details of the new reward to create.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reward'
            examples:
              Points Reward Example:
                value:
                  title: Free entrance for 10 points on 1 specific event
                  type: POINTS
                  categories:
                  - Doen
                  promotionalDescription: this is the mandatory description
                  publicationPeriod:
                    begin: '2021-08-24T14:15:22+00:00'
                  moreInfoURL: https://example.org/more-info-about-this-reward
                  points: 10
              Welcome Reward Example:
                value:
                  title: Gratis tas koffie
                  type: WELCOME
                  promotionalDescription: this is the mandatory description
                  publicationPeriod:
                    begin: '2021-08-24T14:15:22+00:00'
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /rewards/{rewardId}:
    parameters:
    - schema:
        type: string
      name: rewardId
      in: path
      required: true
      description: Unique ID of a single reward.
    get:
      x-internal: false
      summary: Retrieve reward
      tags:
      - Rewards
      responses:
        '200':
          description: Details of the requested reward.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
              examples:
                Example:
                  value:
                    id: '1234'
                    type: POINTS
                    title: Free entrance for 10 points on 1 specific event UPDATE
                    owningCardSystem:
                      id: 1
                      name: UiTPAS Dender
                    allCardSystems: true
                    status: ACTIVE
                    maxAvailableUnits: 0
                    unitsTaken: 0
                    promotionalDescription: this is the mandatory description
                    practicalInfo: this is an optional extra description
                    pictures:
                    - https://www.uitpas.be/default-picture-for-ticketsale-rewards.png
                    publicationPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    redeemPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    grantingPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    moreInfoURL: https://example.org/more-info-about-this-reward
                    inSpotlight: false
                    points: 10
                    categories:
                    - Eten en drinken
                    forKids: false
                    sport: false
                    online: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found. Possible error types:


            * https://api.publiq.be/probs/uitpas/reward-not-found


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      operationId: get-rewards-id
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      description: 'Retrieve reward by ID.


        The caller of this request must have `REWARDS_READ` permission for the given organizer.'
    put:
      x-internal: false
      summary: Update reward
      operationId: put-rewards-id
      responses:
        '200':
          description: Updated info for the reward with the given ID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reward'
              examples:
                Example:
                  value:
                    id: '1234'
                    type: POINTS
                    title: Gratis toegangsticket voor het Design Museum Brussel
                    owningCardSystem:
                      id: 1
                      name: UiTPAS Dender
                    allCardSystems: true
                    status: ACTIVE
                    maxAvailableUnits: 1000
                    unitsTaken: 0
                    promotionalDescription: this is the mandatory description
                    practicalInfo: this is an optional extra description
                    pictures:
                    - https://www.uitpas.be/default-picture-for-ticketsale-rewards.png
                    publicationPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    redeemPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    grantingPeriod:
                      begin: '2021-08-24T14:15:22+00:00'
                      end: '2022-08-24T14:15:22+00:00'
                    moreInfoURL: https://www.uitpas.be/reward/example-more-info
                    inSpotlight: false
                    points: 10
                    categories:
                    - Doen
                    forKids: false
                    sport: false
                    online: false
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitpas/invalid-card-system

            * https://api.publiq.be/probs/uitpas/reward-not-editable


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found. Possible error types:


            * https://api.publiq.be/probs/uitpas/reward-not-found


            The detail property might include more information for the client developer.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      security:
      - USER_ACCESS_TOKEN: []
      - CLIENT_ACCESS_TOKEN: []
      requestBody:
        description: New details for the reward. Will overwrite the previous details.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Reward'
            examples:
              Example:
                value:
                  title: Gratis toegangsticket voor het Design Museum Brussel
                  type: POINTS
                  maxAvailableUnits: 1000
                  categories:
                  - Doen
                  promotionalDescription: this is the mandatory description
                  practicalInfo: this is an optional extra description
                  publicationPeriod:
                    begin: '2021-08-24T14:15:22+00:00'
                    end: '2022-08-24T14:15:22+00:00'
                  redeemPeriod:
                    begin: '2021-08-24T14:15:22+00:00'
                    end: '2022-08-24T14:15:22+00:00'
                  grantingPeriod:
                    begin: '2021-08-24T14:15:22+00:00'
                    end: '2022-08-24T14:15:22+00:00'
                  moreInfoURL: https://example.org/more-info-about-this-reward
                  points: 10
      tags:
      - Rewards
      description: 'Update reward.

        To update a reward correctly, as a client you will typically `GET` the reward first, make the required changes in the reward json and use this `PUT` request to persist those changes in UiTPAS.


        Do note that the following fields are **not editable** after this reward is redeemed by (for POINTS rewards) or granted to (for WELCOME rewards) a passholder:

        * redeemPeriod.begin

        * grantingPeriod.begin

        * points


        Attempts to edit such rewards will result in an HTTP 400 error with type `https://api.publiq.be/probs/uitpas/reward-not-editable`


        The caller of this request must have `REWARDS_WRITE` permission for the given organizer.'
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /rewards/{rewardId}/redeem-status:
    parameters:
    - schema:
        type: string
      name: rewardId
      in: path
      required: true
      description: Unique ID of a single reward.
    get:
      x-internal: false
      summary: Check redeem status of a reward for a passholder
      operationId: get-rewards-id-redeem-status
      responses:
        '200':
          description: Info that indicates if the reward with the given ID is redeemable or not by the passholder with the given UiTPAS number.
          content:
            application/json:
              schema:
                type: object
                properties:
                  redeemable:
                    type: boolean
                    description: Whether this reward can be redeemed by the given passholder.
                    readOnly: true
                  reason:
                    type: string
                    description: 'If redeemable is false, this field contains the reason why:

                      - `INVALID_CARD`: the given `uitpasNumber` is not valid.

                      - `PASSHOLDER_VOLUME`: maximum number of times this reward can be redeemed per passholder has been reached.

                      - `PASSHOLDER_POINTS`: passholder does not have enough points to redeem this reward.

                      - `REWARD_PERIOD`: the current date is outside the redeemPeriod of this reward

                      - `REWARD_VOLUME`: maximum number of times this reward can be redeemed (in general) has been reached.

                      - `PASSHOLDER_APPLICABLE_CARDSYSTEMS`: the passholder is not a member of one of the applicable card systems of this reward.

                      - `PASSHOLDER_NO_ACTIVE_CARDSYSTEMS`: the passholder is not active or has no active card system memberships

                      '
                    enum:
                    - INVALID_CARD
                    - PASSHOLDER_VOLUME
                    - PASSHOLDER_POINTS
                    - REWARD_PERIOD
                    - REWARD_VOLUME
                    - PASSHOLDER_APPLICABLE_CARDSYSTEMS
                    - PASSHOLDER_NO_ACTIVE_CARDSYSTEM
                  message:
                    type: string
                    description: User readable message of the reason (only if redeemable if false)
                    readOnly: true
                required:
                - redeemable
              examples:
                Example redeemable:
                  value:
                    redeemable: true
                Example not redeemable:
                  value:
                    redeemable: false
                    reason: PASSHOLDER_POINTS
                    message: Jammer, je hebt nog niet genoeg punten om dit voordeel om te ruilen.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/uitpas/invalid-uitpas-number

            * https://api.publiq.be/probs/uitpas/passholder-not-found

            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 'Not Found. Possible error types:


            * https://api.publiq.be/probs/uitpas/reward-not-found'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'Check the reward redeem status for a passholder.


        The caller of this request must have `REWARDS_REDEEM` permission for the given organizer.'
      security:
      - CLIENT_ACCESS_TOKEN: []
      - USER_ACCESS_TOKEN: []
      tags:
      - Rewards
      parameters:
      - schema:
          type: string
        in: query
        required: true
        name: uitpasNumber
        description: UiTPAS number identifying the passholder who wants to redeem this reward.
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /rewards/redeemed:
    parameters: []
    post:
      x-internal: false
      summary: Redeem reward
      operationId: post-rewards-redeemed
