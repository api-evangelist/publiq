      operationId: get-ticket-sales
      description: 'Retrieve ticket sales based on search parameters. At least one of the following query paramaters is required: `eventId`, `passholderId`. If `passholderId` is specified, then also `organizerId` is required.


        The caller of this request must have `TICKETSALES_SEARCH` permission for the organizer of the given event.


        The `passholder` is included in the response if applicable (passholder can be empty in some cases, e.g. for group passes), and only if the caller of this request has PASSHOLDERS_SEARCH permission.'
      security:
      - USER_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      - CLIENT_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      parameters:
      - schema:
          type: string
        in: query
        name: eventId
        description: Filter ticket sales on this UiTdatabank event.
      - $ref: '#/components/parameters/start'
      - $ref: '#/components/parameters/limit'
      - schema:
          type: string
        in: query
        name: passholderId
        description: Filter ticket sales on this passholder. Filtering on `organizerId` is required when using this filter.
      - schema:
          type: array
          items:
            type: string
        in: query
        name: organizerId
        description: Filter ticket sales for events of this organizer, or events taking place on the location of this organizer.
        explode: true
      - schema:
          type: string
        in: query
        name: eventTitle
        description: Filter ticket sales on this (partial) UiTdatabank event title.
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /ticket-sales/{ticketSaleId}:
    parameters:
    - schema:
        type: string
      name: ticketSaleId
      in: path
      required: true
      description: Id of the previously registered ticket sale
    delete:
      summary: Cancel a ticket sale registration
      operationId: delete-ticket-sales
      responses:
        '204':
          description: No content. The ticket sale was successfully canceled.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Not Found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Ticket Sale not found:
                  value:
                    type: https://api.publiq.be/probs/uitpas/ticket-sale-not-found
                    title: Ticket sale not found
                    status: 404
      description: 'Cancels a single ticket sale registration by its id. (Returned in the response of the ticket sale registration request.)


        The caller of this request must have `TICKETSALES_REGISTER` permission for the organizer of the event of the ticketsale.'
      tags:
      - Ticket sales
      security:
      - USER_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      - CLIENT_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
components:
  schemas:
    Tariff:
