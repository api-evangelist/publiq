openapi: 3.2.0
info:
  title: Publiq Ticket sales API
  version: '4.0'
  contact:
    name: publiq helpdesk
    email: technical-support@publiq.be
    url: https://docs.publiq.be
  x-refined-note:
  - x-source differs across the merged source definitions and was not carried
  description: 'Operations tagged Ticket sales across 2 of this provider''s published API definitions: uitpas-uitpas.json, publiq-uitpas-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-test.uitpas.be
  description: Testing
- url: https://api.uitpas.be
  description: Production
tags:
- name: Ticket sales
paths:
  /tariffs:
    parameters: []
    get:
      summary: Get tariffs
      tags:
      - Ticket sales
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffsResponse'
              examples:
                Single tariff example:
                  value:
                    available:
                    - id: SOCIALTARIFF-1
                      name: Kansentarief
                      price: 1.5
                      type: SOCIALTARIFF
                      remaining: 1
                Multiple tariffs example:
                  value:
                    available:
                    - id: SOCIALTARIFF-1
                      name: Kansentarief
                      price: 1.5
                      remaining: 1
                      type: SOCIALTARIFF
                    - id: COUPON1234
                      name: Cultuurbon 6 euro
                      price: 4
                      remaining: 1
                      type: COUPON
                    - id: COUPON2345
                      name: 2 euro korting op een specifiek event
                      price: 8
                      remaining: 1
                      type: COUPON
                Single tariff with multiple number of tickets:
                  value:
                    available:
                    - id: SOCIALTARIFF
                      name: Kansentarief
                      price: 1.5
                      remaining: 20
                      type: SOCIALTARIFF
                No available tariffs with message about social tariff:
                  value:
                    available: []
                    endUserMessage:
                      nl: Je hebt geen recht meer op kansentarief voor deze activiteit. Je kan maximaal 1 ticket per maand kopen aan kansentarief voor deze activiteit.
                Coupon tariff with message about social tariff:
                  value:
                    available:
                    - id: COUPON2345
                      name: 2 euro korting op een specifiek event
                      price: 8
                      remaining: 1
                      type: COUPON
                    endUserMessage:
                      nl: Je hebt geen recht meer op kansentarief voor deze activiteit. Je kan maximaal 1 ticket per maand kopen aan kansentarief voor deze activiteit.
                No available tariffs with message about coupon:
                  value:
                    available: []
                    endUserMessage:
                      nl: Je hebt een coupon voor deze activiteit, maar je kan hiermee maximaal 1 ticket per maand kopen.
        '400':
          description: 'Bad Request. The response will include a JSON body with more details in the form of a RFC7807 error model. Possible error types:


            * https://api.publiq.be/probs/uitpas/event-not-found

            * https://api.publiq.be/probs/uitpas/passholder-not-found

            * https://api.publiq.be/probs/uitpas/passholder-no-active-cardsystems

            * https://api.publiq.be/probs/uitpas/social-tariff-expired

            * https://api.publiq.be/probs/uitpas/social-tariff-suspended

            * https://api.publiq.be/probs/uitpas/invalid-uitpasnumber

            * https://api.publiq.be/probs/uitpas/invalid-card

            * https://api.publiq.be/probs/uitpas/invalid-card-status


            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Event not found:
                  value:
                    type: https://api.publiq.be/probs/uitpas/event-not-found
                    title: Event id 267B6FCF-46F8-4DA2-8D7D-AADCD2C2715E not found
                    status: 400
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: get-tariffs
      description: 'Returns the possible UiTPAS discounted **tariffs for an event and a passholder**.


        This UiTPAS tariffs are calculated based on:


        - **The regular price** of the ticket.

        This is the price your user would have to pay for the specific ticket without UiTPAS discount.

        - **The UiTPAS number** of the passholder. UiTPAS discounts are personal so it''s important to identify the passholder to retrieve a list of possible tariffs.

        - **The event id** of the UiTdatabank event. UiTPAS discounts are limited to specific UiTdatabank events, so it''s important to specify the event id to retrieve a list of possible tariffs.


        > ##### Important

        > The regular price of the ticket should generally be one of the price categories set on the event in UiTdatabank to make financial reporting clearer.


        The caller of this request must have `TARIFFS_READ` permission for the organizer of the given event.'
      security:
      - USER_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      - CLIENT_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      parameters:
      - schema:
          type: number
        in: query
        name: regularPrice
        description: The regular price the passholder would have to pay for the ticket if they are not eligible for discounts
        required: true
      - schema:
          type: string
        in: query
        name: eventId
        description: The id of the event for which the ticket is sold
        required: true
      - schema:
          type: string
        in: query
        name: uitpasNumber
        description: UiTPAS Number identifying the passholder who wants to buy a ticket
        required: true
      - schema:
          type: string
          enum:
          - ANY
          - SOCIALTARIFF
          - COUPON
          default: ANY
        in: query
        name: type
        description: Return only available tariffs of this type. Defaults to ANY type.
        required: false
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /tariffs/static:
    parameters: []
    get:
      summary: Get static tariffs without passholder
      tags:
      - Ticket sales
      responses:
        '200':
          description: OK
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TariffsResponse'
              examples:
                Social tariff:
                  value:
                    available:
                    - id: SOCIALTARIFF-1
                      name: Kansentarief
                      price: 1.5
                      type: SOCIALTARIFF
                      remaining: 1
        '400':
          description: 'Bad Request. The response will include a JSON body with more details in the form of a RFC7807 error model. Possible error types:


            * https://api.publiq.be/probs/uitpas/event-not-found

            * https://api.publiq.be/probs/uitpas/social-tariff-not-available


            '
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Event not found:
                  value:
                    type: https://api.publiq.be/probs/uitpas/event-not-found
                    title: Event id 267B6FCF-46F8-4DA2-8D7D-AADCD2C2715E not found
                    status: 400
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      operationId: get-tariffs-static
      description: 'Returns the **static** UiTPAS discounted **tariffs for an event**.


        > ##### Important

        > UiTPAS tariffs are different for each indiviual passholder, but this endpoint does NOT take the passholder into consideration. Use this endpoint only in specific cases, e.g. when listing the UiTPAS tariff before the passholder is known. The actual passholder tariffs might be different than this response. Use GET /tariffs to retrieve indidivual tariffs for a passholder.


        This UiTPAS tariffs are calculated based on:


        - **The regular price** of the ticket.

        This is the price your user would have to pay for the specific ticket without UiTPAS discount.

        - **The event id** of the UiTdatabank event. UiTPAS discounts are limited to specific UiTdatabank events, so it''s important to specify the event id to retrieve a list of possible tariffs.


        Because the passholder is unknown, UiTPAS will return the tariffs for a passholder with social tariff, who lives in the same region as the event organizer.


        The caller of this request must have `TARIFFS_READ` permission for the organizer of the given event.'
      security:
      - USER_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      - CLIENT_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      parameters:
      - schema:
          type: number
        in: query
        name: regularPrice
        description: The regular price the passholder would have to pay for the ticket if they are not eligible for discounts
        required: true
      - schema:
          type: string
        in: query
        name: eventId
        description: The id of the event for which the ticket is sold
        required: true
    servers:
    - url: https://api-test.uitpas.be
      description: Testing
    - url: https://api.uitpas.be
      description: Production
  /ticket-sales:
    parameters: []
    post:
      summary: Register ticket sale(s)
      tags:
      - Ticket sales
      operationId: post-ticket-sales
      responses:
        '200':
          description: Ticket sale registration(s) succeeded
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketSale'
              examples:
                Single ticket sale example:
                  value:
                  - id: '21345'
                    tariff:
                      id: COUPON1234
                      name: Cultuurbon 6 euro
                      price: 1.5
                      type: COUPON
                    uitpasNumber: '0560002524314'
                    eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                    regularPrice: 10
                    regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                Multiple ticket sales example:
                  value:
                  - id: '21345'
                    tariff:
                      id: COUPON1234
                      name: Cultuurbon 6 euro
                      price: 4
                      type: COUPON
                    uitpasNumber: '0560002524314'
                    eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                    regularPrice: 10
                    regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                  - id: '21346'
                    tariff:
                      id: SOCIALTARIFF
                      name: Kansentarief
                      price: 1.5
                      type: SOCIALTARIFF
                    uitpasNumber: 0940002524123
                    eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                    regularPrice: 10
                    regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
        '400':
          description: 'Bad Request. Possible error types:


            * https://api.publiq.be/probs/body/missing

            * https://api.publiq.be/probs/body/invalid-syntax

            * https://api.publiq.be/probs/body/invalid-data

            * https://api.publiq.be/probs/uitpas/social-tariff-expired

            * https://api.publiq.be/probs/uitpas/social-tariff-suspended

            * https://api.publiq.be/probs/uitpas/maximum-reached

            * https://api.publiq.be/probs/uitpas/invalid-number-of-tickets

            * https://api.publiq.be/probs/uitpas/event-not-found

            * https://api.publiq.be/probs/uitpas/passholder-not-found

            * https://api.publiq.be/probs/uitpas/invalid-uitpasnumber

            * https://api.publiq.be/probs/uitpas/invalid-card

            * https://api.publiq.be/probs/uitpas/invalid-card-status

            * https://api.publiq.be/probs/uitpas/passholder-no-active-cardsystems

            * https://api.publiq.be/probs/uitpas/invalid-coupon



            The type indicates the error on one of the failed ticket sale registrations. All other ticket sale registration in the request will be rolled back in case of an error.


            The property `jsonPointer` will a referene to the erroneous `TicketSaleRequest` object if applicable.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                Social tariff discount expired:
                  value:
                    type: https://api.publiq.be/probs/uitpas/social-tariff-discount-expired
                    title: Social tariff discount expired
                    status: 400
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 'Registers one or more new ticket sales **with a discounted UiTPAS tariff**, so the UiTPAS organiser can get reimbursed for the discount.


        Before you can register a discounted ticket sale, you will need to request the possible discounted tariffs from the `GET /tariffs` endpoint and let your end user pick one of the available tariffs. Afterward, you can register a ticket sale using this endpoint.


        You will need:


        - The `uitpasNumber` of the passholder buying the ticket.

        - The `eventId` of the UiTdatabank event.

        - The chosen `tariff` from the `GET /tariffs` request. (only the `id` is required)

        - The `regularPrice` the passholder would normally have to pay for this ticket


        Optionally you can include:

        - a `regularPriceLabel` describing the regular price if you have multiple price

        categories, which can be useful in the financial reporting overview.


        If you want to register more than one ticket sale for the same passholder, for the same event, at the same tariff, use multiple `TicketSale` objects in this request. Do note this is only possible if `remaining` was higher than one in the `GET /tariffs` request.


        The `passholder` field of `TicketSale` is ignored in the request body. It is included in the response if applicable (passholder can be empty in some cases, e.g. for group passes), but only if the caller of this request has `PASSHOLDERS_SEARCH` permission.


        > ##### Error handling

        > **If one of the ticket sales is invalid** (for example the chosen tariff is incorrect or expired), **none of the ticket sales will be registered**. You will instead get an error response with more details about the problem, and can then retry the registration without the incorrect ticket sales or ask the end user to change the tickets and/or tariffs that they want.


        The caller of this request must have `TICKETSALES_REGISTER` permission for the organizer of the given event.'
      security:
      - USER_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      - CLIENT_ACCESS_TOKEN:
        - https://api.publiq.be/auth/uitpas
      requestBody:
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/TicketSale'
            examples:
              Example for one ticket sale:
                value:
                - tariff:
                    id: COUPON1234
                  uitpasNumber: '0560002524314'
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
              Example for multiple ticket sales:
                value:
                - tariff:
                    id: COUPON1234
                  uitpasNumber: '0560002524314'
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Base tariff
                - tariff:
                    id: SOCIALTARIFF
                  uitpasNumber: 0930002523422
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Base tariff
                - tariff:
                    id: REWARD21343
                  uitpasNumber: 0985002524385
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
              Example for multiple ticket sales at the same tariff:
                value:
                - uitpasNumber: '0560002524314'
                  tariff:
                    id: SOCIALTARIFF
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                - uitpasNumber: '0560002524314'
                  tariff:
                    id: SOCIALTARIFF
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                - uitpasNumber: '0560002524314'
                  tariff:
                    id: SOCIALTARIFF
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                - uitpasNumber: '0560002524314'
                  tariff:
                    id: SOCIALTARIFF
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
                - uitpasNumber: '0560002524314'
                  tariff:
                    id: SOCIALTARIFF
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
                  regularPriceLabel: Optional descriptive label of the regular price. Used in financial reporting.
              Example using a reward tariff:
                value:
                - tariff:
                    id: REWARD1234
                  uitpasNumber: '0560002524314'
                  eventId: 31e926e2-a35f-11eb-bcbc-0242ac130002
                  regularPrice: 10
        description: One or more new ticket sales to register.
    get:
      summary: Retrieve existing ticket sales
      tags:
      - Ticket sales
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketSalesPaginatedResponse'
