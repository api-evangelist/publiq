    evidence:
    - source: https://www.publiq.be/projecten/publiq-platform/algemene-verwerkingsvoorwaarden
      http_status: 200
      fetched: '2026-10-09'
      quote: "De Verwerker Verwerkt de Persoonsgegevens alleen binnen de Europese Economische Ruimte, tenzij hierover met de Verwerkingsverantwoordelijke andere afspraken zijn gemaakt."
    note: >-
      EEA-only processing, imposed on the UiTPAS-API integrator as processor of publiq's data unless agreed
