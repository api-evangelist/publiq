  exit_assistance:
    url: https://www.publiq.be/projecten/publiq-platform/algemene-verwerkingsvoorwaarden
    section: 'Artikel 3: Duur'
    evidence:
    - source: https://www.publiq.be/projecten/publiq-platform/algemene-verwerkingsvoorwaarden
      http_status: 200
      fetched: '2026-10-09'
      quote: "Na beëindiging van de Verwerkingsovereenkomst dient de Verwerker aan de Verwerkingsverantwoordelijke zonder onredelijke vertraging, en onverwijld op verzoek, een kopie te bezorgen van alle Persoonsgegevens die door haar in het kader van de Samenwerking Verwerkt worden, in gestructureerd, gangbaar en machine leesbaar formaat."
    note: >-
      On termination the processor (the integrator) must return all personal data to publiq in a
      structured, machine-readable format and then destroy all copies. This is data return toward publiq,
      not an exit-assistance promise by publiq to its users; the platform terms instead say publiq may
      suspend or end the publication tools without any right to compensation.
