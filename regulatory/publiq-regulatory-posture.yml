      http_status: 200
      fetched: '2026-10-09'
      quote: "De Verwerker verbindt zich ertoe elk Datalek en alle ernstige pogingen tot onrechtmatige of ongeautoriseerde Verwerkingen of toegangen tot Persoonsgegevens zonder onredelijke vertraging, en uiterlijk 24 uur na kennisname, te melden aan de Verwerkingsverantwoordelijke conform artikel 33.3 van de AVG."
    note: >-
      Direction matters: this binds the UiTPAS-API user (processor) to notify publiq (controller) of a data
