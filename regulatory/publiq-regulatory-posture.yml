      http_status: 200
      fetched: '2026-10-09'
      quote: "Verder zijn een aantal partijen betrokken bij de werkzaamheden van publiq, die om die reden een rol spelen in de verwerking van persoonsgegevens. Dit zijn onze zogenaamde “verwerkers”. Met deze verwerkers is een verwerkersovereenkomst afgesloten waarin precies is omschreven welke persoonsgegevens voor welk doel mogen worden verwerkt."
