notes: >-
  All source pages are in Dutch; quotes are verbatim Dutch, notes give an English reading. The
  Algemene Verwerkingsvoorwaarden (general processing terms) apply to UiTPAS-API users, who act as
  PROCESSOR for publiq vzw (controller) per Gebruiksvoorwaarden 8.3. Clauses drawn from that document
  therefore bind the API integrator toward publiq, not publiq toward its users. The Responsible
  Disclosure Policy (https://www.publiq.be/projecten/publiq-platform/responsible-disclosure-policy, 200)
  speaks to no signal in this vocabulary and is not used here.
